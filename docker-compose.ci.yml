services:
  # Pull cached public images directly to avoid shared-runner Docker Hub limits.
  # https://cloud.google.com/artifact-registry/docs/pull-cached-dockerhub-images
  db:
    image: mirror.gcr.io/library/postgres:16.1-alpine

  redis:
    image: mirror.gcr.io/library/redis:7.2.4-alpine

  stripemock:
    image: stripe-mock-ci:0.170.0
    pull_policy: build
    build:
      context: .github/docker/stripe-mock

  backend:
    volumes:
      - ${PWD}/packages/webapp-libs/webapp-emails/build/email-renderer:/app/scripts/email/renderer:ro
      - ./packages/backend/:/app
      - ./packages/backend/cov:/app/cov
      - ./packages/backend/docs:/app/docs
    environment:
      - CI=true
    build:
      args:
        - SB_MIRROR_REPOSITORY=${SB_MIRROR_REPOSITORY}
        - SB_PULL_THROUGH_CACHE_REPOSITORY=${SB_PULL_THROUGH_CACHE_REPOSITORY}

  workers:
    volumes:
      - ./packages/workers/cov:/app/packages/workers/cov
    environment:
      - CI=true
      - PROJECT_NAME=${PROJECT_NAME}
      - ENV_STAGE=${ENV_STAGE}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_DEFAULT_REGION=${AWS_DEFAULT_REGION}
      - AWS_SESSION_TOKEN=${AWS_SESSION_TOKEN}
      - AWS_SECURITY_TOKEN=${AWS_SECURITY_TOKEN}
      - AWS_SESSION_EXPIRATION=${AWS_SESSION_EXPIRATION}
    build:
      args:
        - SB_MIRROR_REPOSITORY=${SB_MIRROR_REPOSITORY}
        - SB_PULL_THROUGH_CACHE_REPOSITORY=${SB_PULL_THROUGH_CACHE_REPOSITORY}
