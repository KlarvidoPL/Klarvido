{% load i18n %}
{% if request.user.otp_enabled and request.user.otp_verified %}
  <div class="form-row">
    {% if otp_error %}<p class="errornote" role="alert">{{ otp_error }}</p>{% endif %}
    <label for="organization-deletion-otp">{% translate "Authentication code" %}</label>
    <input id="organization-deletion-otp" name="otp_token" inputmode="numeric"
           autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6" required>
  </div>
{% endif %}
