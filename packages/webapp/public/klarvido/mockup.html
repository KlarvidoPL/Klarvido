function settingsScreen(){const tab=state.settingsTab;return shell(`<div class="page-header"><div><h1>Ustawienia</h1><p>Zarządzaj profilem firmy, dostępem, wyglądem i bezpieczeństwem.</p></div></div><div class="settings-wrap"><div class="card settings-menu">${settingsBtn('profile','Profil biznesowy')}${settingsBtn('users','Użytkownicy i dostęp')}${settingsBtn('appearance','Wygląd i kolory')}${settingsBtn('notifications','Powiadomienia')}${settingsBtn('security','Bezpieczeństwo')}${settingsBtn('plan','Plan i rozliczenia')}</div><div>${settingsPanelV2(tab)}</div></div>`,'settings')}
function settingsPanelV2(tab){if(tab==='users')return `<div class="card"><div style="display:flex;justify-content:space-between;align-items:start"><div><h2 style="margin:0">Użytkownicy i dostęp</h2><p class="card-sub">Role są przypisane do firmy, nie do całego konta.</p></div><button class="btn btn-primary btn-sm" onclick="inviteUserModal()">+ Zaproś osobę</button></div><div style="margin-top:16px">${state.team.map((u,i)=>`<div class="team-row"><div><b>${u.name}</b><div class="tiny-note">${u.email}</div></div><select class="role-select" onchange="state.team[${i}].role=this.value"><option ${u.role==='Właściciel'?'selected':''}>Właściciel</option><option ${u.role==='Administrator'?'selected':''}>Administrator</option><option ${u.role==='Księgowa'?'selected':''}>Księgowa</option><option ${u.role==='Doradca'?'selected':''}>Doradca</option><option ${u.role==='Tylko odczyt'?'selected':''}>Tylko odczyt</option></select><span class="pill ${u.status==='Aktywny'?'green':'blue'}">${u.status}</span><button class="subtle-link" onclick="toast('Menu uprawnień — symulacja')">•••</button></div>`).join('')}</div><div class="system-note" style="margin-top:14px">Przyszły widok biura rachunkowego może korzystać z tej samej architektury uprawnień, ale z dostępem do wielu firm.</div></div>`;if(tab==='appearance')return `<div class="card"><h2 style="margin-top:0">Wygląd i kolorystyka</h2><p class="card-sub">Wybierz wariant interfejsu. Logo pozostaje jednokolorowe zgodnie z identyfikacją.</p><div class="theme-grid" style="margin-top:18px">${Object.entries(themes).map(([k,t])=>`<button class="theme-option ${state.theme===k?'active':''}" onclick="applyTheme('${k}');render()"><div class="swatches"><span class="swatch" style="background:${t.primary}"></span><span class="swatch" style="background:${t.accent}"></span><span class="swatch" style="background:${t.bg}"></span></div><b>${t.name}</b><div class="tiny-note" style="margin-top:5px">Podgląd na żywo</div></button>`).join('')}</div><div class="summary-banner" style="margin-top:20px"><div class="summary-icon">◐</div><div><b>Zasada marki</b><p class="card-sub">Logo zawsze jednokolorowe. Akcent służy do działania/uwagi, a zielony i czerwony pozostają semantyczne.</p></div></div></div>`;if(tab==='notifications')return `<div class="card"><h2 style="margin-top:0">Powiadomienia</h2><p class="card-sub">Klarvido ma odzywać się wtedy, gdy naprawdę warto.</p>${notifRows()}</div>`;if(tab==='security')return `<div class="card"><h2 style="margin-top:0">Bezpieczeństwo i dane</h2><div class="grid grid-2" style="margin-top:16px"><div class="card compact"><b>MFA</b><p class="card-sub">Dodatkowa ochrona konta</p><span class="pill green">Włączone</span></div><div class="card compact"><b>Historia logowań</b><p class="card-sub">Ostatnie aktywności i urządzenia</p><button class="btn btn-secondary btn-sm">Zobacz szczegóły</button></div><div class="card compact"><b>Sesje aktywne</b><p class="card-sub">2 urządzenia</p><button class="btn btn-secondary btn-sm">Zarządzaj</button></div><div class="card compact"><b>Audyt decyzji</b><p class="card-sub">Wersje obliczeń i źródła</p><button class="btn btn-secondary btn-sm" onclick="openExplainModal('Audyt systemu')">Pokaż przykład</button></div></div></div>`;if(tab==='plan')return `<div class="card"><h2 style="margin-top:0">Plan i rozliczenia</h2><div class="grid grid-3" style="margin-top:16px"><div class="card compact"><div class="tiny-note">Aktualny plan</div><h3>Klarvido Pro</h3></div><div class="card compact"><div class="tiny-note">Użytkownicy</div><h3>${state.team.length} / 10</h3></div><div class="card compact"><div class="tiny-note">Płatności</div><h3 style="color:var(--success)">Aktywny</h3></div></div></div>`;return `<div class="card"><div style="display:flex;justify-content:space-between;align-items:start"><div><h2 style="margin:0">Profil biznesowy</h2><p class="card-sub">Profil jest żywy — Klarvido porównuje deklaracje z realnymi wzorcami w danych.</p></div><button class="btn btn-secondary btn-sm" onclick="navigate('onboarding')">Edytuj profil</button></div><div class="grid grid-4" style="margin-top:18px"><div class="card compact"><b>Stała obsługa</b><div class="value" style="font-size:23px">~65%</div><div class="tiny-note">udział w przychodach</div></div><div class="card compact"><b>Projekty</b><div class="value" style="font-size:23px">~30%</div><div class="tiny-note">udział w przychodach</div></div><div class="card compact"><b>Inne</b><div class="value" style="font-size:23px">~5%</div><div class="tiny-note">udział w przychodach</div></div><div class="card compact"><b>Głównie</b><div class="value" style="font-size:23px">B2B</div><div class="tiny-note">model współpracy</div></div></div><div class="demo-note" style="margin-top:16px">Dane z ostatnich 6 miesięcy sugerują, że udział projektów jest większy niż podałeś podczas konfiguracji. <button class="btn btn-primary btn-sm" style="float:right" onclick="navigate('company-profile')">Sprawdź →</button></div><div class="section-title"><h2>Dane podstawowe</h2></div><div class="grid grid-3"><div><div class="tiny-note">Nazwa firmy</div><b>${state.currentCompany}</b></div><div><div class="tiny-note">NIP</div><b>123 456 78 90</b></div><div><div class="tiny-note">Branża</div><b>Produkcja mebli</b></div></div></div>`}
function printReport(){toast('Otwieram widok do zapisu jako PDF…');setTimeout(()=>window.print(),350)}
function askAssistant(q){if(!q)return;const box=document.getElementById('chat-messages');if(!box)return;box.innerHTML+=`<div class="message user">${q}</div>`;let a='Na podstawie danych demonstracyjnych mogę pokazać Ci analizę krok po kroku.';if(q.includes('dostawca'))a='<b>DrewnoPol odpowiada za największy wzrost kosztów.</b><br>Ceny porównywalnych zakupów są w demo o ok. 18% wyższe niż 6 miesięcy temu. Rynek (GUS/PPI) wzrósł o ok. 7,2%, więc zmiana w firmie jest wyraźnie większa.';else if(q.includes('5%'))a='W aktualnym scenariuszu podwyżka cen o 5% daje ok. +21,8 tys. zł miesięcznego przychodu przy założeniu utrzymania 82% wolumenu. <button class="subtle-link" onclick="state.scenarioType=\'price\';state.scenarioPrice=5;navigate(\'scenarios\')">Otwórz scenariusz →</button>';else if(q.includes('Dlaczego'))a='Koszty materiałów wzrosły szybciej niż sprzedaż. Udział materiałów w sprzedaży wzrósł z 34% do 41%. Dane rynkowe tłumaczą część zmiany, ale nie całość.';else if(q.includes('zatrudnić'))a='Nie mam pełnych danych o wykorzystaniu zespołu. Mogę jednak policzyć próg finansowy. <button class="subtle-link" onclick="state.scenarioType=\'hire\';navigate(\'scenarios\')">Uruchom scenariusz zatrudnienia →</button>';else if(q.includes('negocjacji'))a='Przygotowałbym listę 5 najczęściej kupowanych pozycji, ich zmian cenowych, faktur źródłowych i porównanie do kontekstu GUS/PPI. Możesz przejść do profilu dostawcy.';box.innerHTML+=`<div class="message ai">${a}</div>`;document.getElementById('assistant-q').value='';document.querySelector('.assistant-body').scrollTop=99999}
function fitEventsCard(){
  const chart=document.getElementById('today-chart-card');
  const events=document.getElementById('today-events-card');
  const list=document.getElementById('today-events-list');
  if(!chart||!events||!list)return;
  const maxH=chart.getBoundingClientRect().height;
  let guard=20;
  while(events.getBoundingClientRect().height>maxH&&list.children.length>1&&guard-->0){
    list.removeChild(list.lastElementChild);
  }
}
function fitActionsCard(){
  const decisionsCard=document.getElementById('start-decisions-card');
  const actionsCard=document.getElementById('start-actions-card');
  const list=document.getElementById('start-actions-list');
  if(!decisionsCard||!actionsCard||!list)return;
  const maxH=decisionsCard.getBoundingClientRect().height;
  let guard=20;
  while(actionsCard.getBoundingClientRect().height>maxH&&list.children.length>1&&guard-->0){
    list.removeChild(list.lastElementChild);
  }
}
function render(){closeModal();const routes={login:loginScreen,onboarding:onboardingScreen,'company-profile':companyProfileScreen,'first-analysis':firstAnalysis,today:todayScreen,workspace:workspaceScreen,analysis:analysisScreen,detail:detailStatementScreen,clients:clientsScreen,'client-detail':clientDetailScreen,costs:costsScreen,suppliers:suppliersScreen,'supplier-detail':supplierDetailScreen,decisions:decisionsScreen,actions:actionsScreen,sources:sourcesScreen,market:marketScreen,scenarios:scenariosScreen,invoices:invoicesScreen,notifications:notificationsScreen,settings:settingsScreen,portfolio:portfolioScreen};const fn=routes[state.route]||todayScreen;document.getElementById('app').innerHTML=fn();renderAssistant();if(state.route==='today')requestAnimationFrame(()=>{fitEventsCard();fitActionsCard()})}

render();
</script>
