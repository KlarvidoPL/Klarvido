<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Klarvido — funkcjonalny mockup</title>
  <style>
    @import url('https://api.fontshare.com/v2/css?f[]=satoshi@400,500,600,700&display=swap');
    :root{
      --primary:#0B2545;
      --primary-2:#143A66;
      --accent:#F59E0B;
      --accent-soft:#FFF4DB;
      --bg:#F7F9FC;
      --surface:#FFFFFF;
      --surface-2:#F8FAFD;
      --border:#E4EAF1;
      --text:#0B2545;
      --muted:#6B7C93;
      --success:#13A66A;
      --success-soft:#EAF8F2;
      --danger:#E34D59;
      --danger-soft:#FFF0F1;
      --info:#2A6FDB;
      --info-soft:#EEF5FF;
      --shadow:0 12px 30px rgba(23,53,87,.07);
      --radius:16px;
      --radius-sm:11px;
      --sidebar:#FBFCFE;
    }
    *{box-sizing:border-box}
    html,body{height:100%}
    body{margin:0;font-family:'Satoshi','Inter','Segoe UI',Arial,sans-serif;background:var(--bg);color:var(--text);font-size:14px}
    button,input,select,textarea{font:inherit}
    button{cursor:pointer}
    a{color:inherit;text-decoration:none}
    .hidden{display:none!important}
    .app{min-height:100%;display:flex}
    .sidebar{width:232px;position:fixed;left:0;top:0;bottom:0;background:var(--sidebar);border-right:1px solid var(--border);padding:18px 14px;display:flex;flex-direction:column;z-index:30}
    .brand{height:74px;display:flex;align-items:center;padding:3px 7px 12px}
    .brand img{width:176px;height:auto;object-fit:contain;object-position:left center}
    .nav{display:flex;flex-direction:column;gap:5px;margin-top:8px}
    .nav-sep{height:1px;background:var(--border);margin:12px 8px}
    .nav-item{border:0;background:transparent;border-radius:12px;padding:11px 12px;display:flex;align-items:center;gap:11px;color:#60748D;text-align:left;transition:.18s}
    .nav-item:hover{background:#F0F4F9;color:var(--primary)}
    .nav-item.active{background:#EAF1F8;color:var(--primary);font-weight:700}
    .nav-item .badge{margin-left:auto;min-width:24px;padding:2px 7px;border-radius:999px;background:var(--accent-soft);color:#B06B00;text-align:center;font-size:12px}
    .nav-icon{width:20px;height:20px;display:grid;place-items:center;color:currentColor}
    .profile-mini{margin-top:auto;padding:12px 9px;border-top:1px solid var(--border);display:flex;align-items:center;gap:10px}
    .avatar{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--primary);color:white;font-weight:700;font-size:12px}
    .profile-mini small{display:block;color:var(--muted);font-size:11px}
    .main{margin-left:232px;width:calc(100% - 232px);min-height:100vh}
    .topbar{height:68px;border-bottom:1px solid var(--border);background:rgba(255,255,255,.94);backdrop-filter:blur(12px);display:flex;align-items:center;gap:16px;padding:0 26px;position:sticky;top:0;z-index:25}
    .company-switch{height:40px;padding:0 12px;border:1px solid var(--border);border-radius:10px;background:white;color:var(--text);display:flex;align-items:center;gap:8px}
    .data-status{font-size:12px;color:#397B64;background:#EFF8F4;border:1px solid #DDEFE7;padding:8px 11px;border-radius:10px;display:flex;align-items:center;gap:7px}
    .dot{width:8px;height:8px;border-radius:50%;background:var(--success)}
    .global-search{margin-left:auto;width:360px;position:relative}
    .global-search input{width:100%;height:40px;border:1px solid var(--border);border-radius:10px;padding:0 40px 0 38px;background:#FBFCFE;color:var(--text);outline:none}
    .global-search::before{content:'⌕';position:absolute;left:13px;top:8px;font-size:20px;color:#58718F}
    .kbd{position:absolute;right:10px;top:9px;font-size:11px;color:var(--muted);border:1px solid var(--border);border-radius:6px;padding:2px 5px;background:white}
    .top-btn{height:40px;min-width:40px;border:1px solid var(--border);background:white;border-radius:10px;color:var(--primary);display:grid;place-items:center;position:relative}
    .top-btn .ping{position:absolute;right:7px;top:6px;width:7px;height:7px;border-radius:50%;background:var(--accent)}
    .user-btn{display:flex;align-items:center;gap:8px;border:0;background:transparent;color:var(--text)}
    .content{padding:28px 30px 48px;max-width:1440px;margin:0 auto}
    .page-header{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;margin-bottom:22px}
    .page-header h1{font-size:30px;line-height:1.08;margin:0 0 7px;letter-spacing:-.6px}
    .page-header p{margin:0;color:var(--muted);font-size:15px}
    .date{font-size:12px;color:#5F7289;padding-top:7px}
    .grid{display:grid;gap:16px}
    .grid-3{grid-template-columns:repeat(3,1fr)}
    .grid-4{grid-template-columns:repeat(4,1fr)}
    .grid-2{grid-template-columns:repeat(2,1fr)}
    .grid-5{grid-template-columns:repeat(5,1fr)}
    .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:0 3px 12px rgba(11,37,69,.025);padding:18px}
    .card.compact{padding:14px}
    .card-title{font-weight:700;font-size:15px;margin:0 0 6px}
    .card-sub{color:var(--muted);font-size:12px;line-height:1.5;margin:0}
    .status-card{position:relative;overflow:hidden;min-height:245px}
    .status-card:before{content:'';position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--accent)}
    .status-card.danger:before{background:var(--danger)}
    .status-card.success:before{background:var(--success)}
    .status-row{display:flex;align-items:center;gap:9px;margin-bottom:14px}
    .status-icon{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--accent-soft);color:#B06B00;font-weight:700}
    .danger .status-icon{background:var(--danger-soft);color:var(--danger)}
    .success .status-icon{background:var(--success-soft);color:var(--success)}
    .pill{display:inline-flex;align-items:center;gap:5px;padding:5px 8px;border-radius:999px;font-size:11px;font-weight:700;background:var(--accent-soft);color:#B06B00}
    .pill.red{background:var(--danger-soft);color:var(--danger)}
    .pill.green{background:var(--success-soft);color:var(--success)}
    .pill.blue{background:var(--info-soft);color:var(--info)}
    .pill.gray{background:#EEF1F5;color:#5B6B7C}
    .decision-hero{position:relative;border:1.5px solid var(--danger);background:linear-gradient(180deg,#FFF6F6,#FFFFFF);border-radius:16px;padding:18px 20px;margin-bottom:16px;display:grid;grid-template-columns:1fr auto;gap:14px;align-items:start}
    .decision-hero .eyebrow{display:flex;align-items:center;gap:6px;font-size:11px;font-weight:800;color:var(--danger);text-transform:uppercase;letter-spacing:.04em;margin-bottom:8px}
    .decision-hero .facts{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:12px}
    .decision-hero .facts .metric-mini{background:#FFFAFA;border-color:#F5D0D4}
    .impact{font-size:16px;font-weight:700;margin:16px 0}
    .impact.red{color:var(--danger)}
    .btn{border:1px solid transparent;border-radius:10px;padding:10px 14px;font-weight:700;display:inline-flex;align-items:center;gap:8px;justify-content:center;transition:.18s}.btn:disabled{opacity:.4;cursor:not-allowed;filter:grayscale(.3)}
    .btn-primary{background:var(--accent);color:#2D2100}
    .btn-primary:hover{filter:brightness(.98);transform:translateY(-1px)}
    .btn-secondary{background:white;border-color:var(--border);color:var(--primary)}
    .btn-danger{background:var(--danger-soft);color:var(--danger);border-color:#F8D4D8}
    .btn-success{background:var(--success-soft);color:#0C7C4E;border-color:#D7EDE3}
    .btn-sm{padding:8px 11px;font-size:12px}
    .kpi{padding:22px 20px}
    .kpi .label{color:var(--muted);font-size:13px;font-weight:600}
    .kpi .value{font-size:32px;font-weight:800;margin:6px 0;letter-spacing:-.01em}
    .kpi .spark{height:56px;margin-top:8px}
    .trend{font-size:13px;font-weight:700}
    .trend.up{color:var(--success)}.trend.down{color:var(--danger)}
    .section-title{display:flex;align-items:center;justify-content:space-between;margin:26px 0 12px}
    .section-title h2{font-size:18px;margin:0}.section-title a{color:#3374CF;font-size:12px}
    .spark{height:44px;margin-top:4px;position:relative}
    .spark[data-tip]{cursor:default}
    .spark[data-tip]:hover::after{content:attr(data-tip);position:absolute;left:50%;top:100%;transform:translateX(-50%);margin-top:9px;background:#0B2545;color:#fff;padding:8px 11px;border-radius:9px;font-size:11px;font-weight:600;line-height:1.4;width:170px;text-align:center;box-shadow:0 10px 24px rgba(11,37,69,.28);z-index:25;pointer-events:none}
    .spark[data-tip]:hover::before{content:'';position:absolute;left:50%;top:100%;transform:translateX(-50%);margin-top:3px;border:5px solid transparent;border-bottom-color:#0B2545;z-index:25;pointer-events:none}
    .spark svg{width:100%;height:100%}
    /* Ten sam "dymek" co przy sparkline w KPI (.spark[data-tip]), tylko jako uniwersalna klasa do
       użycia poza kartami KPI — np. przy dacie miesiąca "w trakcie" w Zestawieniu szczegółowym. */
    /* Dymek pokazuje się NAD kropką (bottom:100%), nie pod nią jak przy .spark — bo ten wariant
       jest używany w ostatnim wierszu tabeli (miesiąc "w trakcie"), a .table-wrap-scroll ma
       overflow:auto, które przycięłoby dymek pokazujący się poniżej. Wyrównany do lewej (nie
       wyśrodkowany) względem kropki, bo kropka siedzi blisko lewej krawędzi tabeli — dymek
       wyśrodkowany wystawałby połową poza przewijany kontener i też zostałby przycięty. */
    .info-tip{position:relative;display:inline-flex;align-items:center;justify-content:center;cursor:default}
    .info-tip[data-tip]:hover::after{content:attr(data-tip);position:absolute;left:0;bottom:100%;margin-bottom:9px;background:#0B2545;color:#fff;padding:8px 11px;border-radius:9px;font-size:11px;font-weight:600;line-height:1.4;width:150px;text-align:center;box-shadow:0 10px 24px rgba(11,37,69,.28);z-index:25;pointer-events:none}
    .info-tip[data-tip]:hover::before{content:'';position:absolute;left:14px;bottom:100%;margin-bottom:3px;border:5px solid transparent;border-top-color:#0B2545;z-index:25;pointer-events:none}
    .info-tip-dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--accent,#E8A43A);margin-left:6px;vertical-align:middle}
    tr.in-progress-row td{background:#FFF8E8}
    .chart-box svg{width:100%;height:100%;display:block}
    .events{display:flex;flex-direction:column}
    .event{padding:12px 0;border-bottom:1px solid var(--border);display:flex;gap:11px;align-items:flex-start}
    .event:last-child{border-bottom:0}.event-dot{width:8px;height:8px;border-radius:50%;background:var(--success);margin-top:7px;flex:0 0 auto}.event-dot.warn{background:var(--accent)}.event-dot.danger{background:var(--danger)}
    .event b{font-size:13px}.event small{display:block;color:var(--muted);margin-top:3px}
    .effect{background:linear-gradient(90deg,var(--success-soft),#F8FFFC);border:1px solid #D8EEE4;padding:16px;border-radius:14px}
    .effect strong{color:#0F8A59}
    .tiny-note{font-size:11px;color:var(--muted)}
    .workspace{display:grid;grid-template-columns:1.65fr .8fr;gap:16px}
    .big-title{font-size:24px;font-weight:700;line-height:1.18;margin:0}
    .decision-head{display:flex;justify-content:space-between;gap:20px;align-items:flex-start;margin-bottom:16px}
    .decision-meta{display:flex;gap:8px;margin-top:10px}
    .right-impact{text-align:right;margin-top:48px}.right-impact .label{color:var(--muted);font-size:12px}.right-impact .num{font-size:25px;font-weight:700;color:var(--danger)}
    .chart-box{height:245px;border:1px solid var(--border);border-radius:12px;padding:14px;background:#FBFCFE}
    .chart-title{font-size:12px;color:var(--muted);margin-bottom:8px}
    .bar-list{display:flex;flex-direction:column;gap:10px;margin-top:12px}
    .bar-row{display:grid;grid-template-columns:120px 1fr 58px;gap:10px;align-items:center;font-size:12px}
    .bar-track{height:9px;border-radius:999px;background:#EEF2F7;overflow:hidden}.bar-fill{height:100%;border-radius:999px;background:var(--primary)}
    .recommend{background:#FFFDF8;border:1px solid #F6E2B8;border-radius:14px;padding:18px}.recommend h3{margin:0 0 7px}.recommend p{color:var(--muted);font-size:13px;line-height:1.55}
    .list-check{display:flex;flex-direction:column;gap:10px;margin-top:15px}.check-row{display:flex;gap:9px;align-items:flex-start;font-size:13px}.check{width:19px;height:19px;border-radius:50%;display:grid;place-items:center;background:var(--success-soft);color:var(--success);font-size:11px;flex:0 0 auto}
    .analysis-tabs{display:flex;gap:26px;border-bottom:1px solid var(--border);margin-bottom:18px}.analysis-tabs button{border:0;background:transparent;padding:10px 2px 12px;color:var(--muted);position:relative}.analysis-tabs button.active{color:var(--primary);font-weight:700}.analysis-tabs button.active:after{content:'';position:absolute;left:0;right:0;bottom:-1px;height:3px;background:var(--accent);border-radius:2px}
    .summary-banner{padding:18px;border-radius:14px;background:#F5F8FC;border:1px solid var(--border);display:flex;gap:14px;align-items:flex-start;margin-bottom:16px}.summary-icon{width:38px;height:38px;border-radius:12px;background:white;display:grid;place-items:center;border:1px solid var(--border)}
    table{width:100%;border-collapse:collapse;font-size:12px}th{text-align:left;color:var(--muted);font-weight:600;padding:10px;border-bottom:1px solid var(--border)}td{padding:11px 10px;border-bottom:1px solid #EDF1F5}tr:last-child td{border-bottom:0}
    /* Zestawienie szczegółowe — 11 kolumn liczb naraz, więc ciaśniejszy padding/czcionka niż w
       standardowej tabeli, żeby zmieściło się bez zawijania. Pierwsza kolumna (Miesiąc) zostaje
       wyrównana do lewej, reszta (same liczby) do prawej dla czytelności. */
    .detail-table th,.detail-table td{padding:7px 8px;font-size:11.5px;white-space:nowrap;text-align:right}
    .detail-table th:nth-child(1),.detail-table td:nth-child(1){text-align:left}
    .detail-table thead tr.group-row th{background:#F5F8FB;font-size:10px;text-transform:uppercase;letter-spacing:.03em;text-align:center;border-bottom:1px solid var(--border)}
    .table-card{padding:0;overflow:visible}.table-card .table-head{padding:15px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
    .table-card .table-wrap-scroll{border-radius:0 0 var(--radius) var(--radius)}
    .progress-line{height:8px;border-radius:999px;background:#EDF2F7;overflow:hidden}.progress-line div{height:100%;background:var(--accent);border-radius:999px}
    .timeline{display:flex;flex-direction:column;gap:0}.timeline-row{display:grid;grid-template-columns:26px 1fr auto;gap:10px;padding:10px 0;position:relative}.timeline-row:not(:last-child):after{content:'';position:absolute;left:10px;top:32px;bottom:-3px;width:2px;background:#E5EBF1}.tl-dot{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:white;border:2px solid #CED9E5;z-index:1;font-size:10px}.tl-dot.done{background:var(--success);border-color:var(--success);color:white}.tl-dot.active{border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
    .data-source-grid{grid-template-columns:repeat(3,1fr)}.source-card{min-height:240px}.source-logo{font-size:24px;font-weight:700;margin-bottom:14px}.source-status{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--success)}
    .coverage{margin-top:15px;display:flex;flex-direction:column;gap:9px}.coverage-row{display:flex;justify-content:space-between;font-size:12px}.tag-ok{color:#0F8A59;background:var(--success-soft);padding:3px 7px;border-radius:6px}.tag-warn{color:#A96800;background:var(--accent-soft);padding:3px 7px;border-radius:6px}
    .settings-wrap{display:grid;grid-template-columns:210px 1fr;gap:18px}.settings-menu{padding:10px}.settings-menu button{display:flex;width:100%;border:0;background:transparent;padding:10px;border-radius:10px;color:var(--muted);text-align:left;margin-bottom:3px}.settings-menu button.active{background:#EEF3F9;color:var(--primary);font-weight:700}
    .theme-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.theme-option{border:1px solid var(--border);background:white;border-radius:12px;padding:13px;text-align:left}.theme-option.active{border-color:var(--accent);box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 22%, transparent)}.swatches{display:flex;gap:7px;margin-bottom:9px}.swatch{width:24px;height:24px;border-radius:50%;border:1px solid rgba(0,0,0,.06)}
    .switch{width:38px;height:22px;border-radius:999px;background:#CBD5E1;padding:3px;border:0;transition:.2s}.switch:after{content:'';display:block;width:16px;height:16px;background:white;border-radius:50%;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:.2s}.switch.on{background:var(--info)}.switch.on:after{transform:translateX(16px)}
    .notif-row{display:grid;grid-template-columns:1fr 95px 95px;gap:14px;align-items:center;padding:12px 0;border-bottom:1px solid var(--border)}
    .kanban{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.kanban-col{background:#F6F8FB;border:1px solid var(--border);border-radius:14px;padding:12px;min-height:310px}.kanban-title{display:flex;justify-content:space-between;font-weight:700;margin-bottom:10px}.task{background:white;border:1px solid var(--border);border-radius:12px;padding:12px;margin-bottom:10px}.task small{display:block;color:var(--muted);margin-top:5px}

/* Kategorie, które z natury oznaczają koszt cykliczny/powtarzalny (nie jednorazowy zakup) —
   podzbiór CATEGORY_OPTIONS. Używane przez newRecurringCosts() do odróżnienia "nowego stałego
   kosztu" od zwykłego nowego zamówienia jednorazowego. */
const RECURRING_CATEGORIES=['Subskrypcja','Najem','Media','Usł. telekomunikacyjna'];
function supplierCategoryOf(name){const inv=invoices.find(i=>i.type==='Zakup'&&i.party===name);return inv?inv.category:''}
/* Realny wzrost kosztów materiałów (kategoria "Materiały produkcyjne": DrewnoPol, Akcesoria XYZ,
   Lakiernia Tęcza, Tapicernia, KlejMax) — liczony na żywo z tego samego suppliers[].trend, które
   napędza Dostawców i Koszty, styczeń → czerwiec. Znaleziony 2026-09-25 babol: karta decyzyjna
   "Materiały" (Decision Workspace) i cała zakładka Rynek/Firma pokazywały wcześniej wpisaną ręcznie
   stałą "+18%", która NIE zgadzała się z żadną realną liczbą w danych (prawdziwy wzrost tej
   kategorii to ~+26%, pojedynczy dostawcy DrewnoPol +22,2%/Akcesoria XYZ +37,5% — oba WYŻSZE niż
   18%). Od teraz jedna funkcja, jedno źródło prawdy, używane wszędzie, gdzie pojawia się to
   porównanie, żeby nie mogło już zdryfować. */
function materialsCostGrowthPct(){
  const mat=suppliers.filter(s=>supplierCategoryOf(s.name)==='Materiały produkcyjne');
  const first=mat.reduce((s,x)=>s+x.trend[0],0),last=mat.reduce((s,x)=>s+x.trend[months.length-1],0);
  return first?(last-first)/first*100:0;
}
/* Struktura kosztów wg kategorii dla wybranego zakresu dat — liczone na żywo z tej samej tablicy
   invoices, której używa zakładka Faktury (jedno źródło prawdy, ten sam wzorzec co przy
   Zestawieniu szczegółowym). Faktury bez przypisanej kategorii trafiają do osobnej grupy
   "Bez kategorii". */
function costCategoryTotals(currentIdxs){
  const monthNums=currentIdxs.map(i=>i+1);
  const purchase=invoices.filter(inv=>inv.type==='Zakup'&&monthNums.includes(invoiceMonthNum(inv.date)));
  const byCategory={};
  purchase.forEach(inv=>{const cat=inv.category||'Bez kategorii';byCategory[cat]=(byCategory[cat]||0)+inv.net});
  const total=purchase.reduce((s,inv)=>s+inv.net,0);
  const rows=Object.entries(byCategory).map(([category,net])=>({category,net,share:total?net/total*100:0})).sort((a,b)=>b.net-a.net);
  return{rows,total}
}
/* "Nowy koszt cykliczny" — dostawca, którego pierwsza faktura (trend[i]>0 po raz pierwszy) pada w
   wybranym zakresie ORAZ nie istniał od stycznia (firstIdx>0), a jego kategoria jest z natury
   cykliczna (RECURRING_CATEGORIES). W obecnych danych to jedyny taki przypadek — CloudArch Backup,
   pierwsza (i na razie jedyna) faktura w czerwcu, kategoria "Subskrypcja". */
function newRecurringCosts(currentIdxs){
  const out=[];
  suppliers.forEach(s=>{
    const firstIdx=s.trend.findIndex(v=>v>0);
    if(firstIdx<=0)return;
    if(!currentIdxs.includes(firstIdx))return;
    const cat=supplierCategoryOf(s.name);
    if(!RECURRING_CATEGORIES.includes(cat))return;
    out.push({name:s.name,amount:Math.round(s.trend[firstIdx]*1000),monthLabel:months[firstIdx],category:cat});
  });
  return out.sort((a,b)=>b.amount-a.amount);
}
/* "Nietypowa faktura" — dwie reguły ustalone z Aleksem: (a) łączna kwota stałego dostawcy w
   wybranym okresie mocno odbiega (>50%) od jego typowej MIESIĘCZNEJ kwoty z pozostałych miesięcy
   (liczone z suppliers[].trend — czyli z prawdziwych miesięcznych sum, a nie z pojedynczych
   linii faktur, które czasem dzielą jeden miesiąc na 2-3 dokumenty i fałszywie zaniżałyby średnią),
   (b) zupełnie nowy kontrahent (pierwsza faktura w całej historii) od razu wystawia fakturę
   >10 000 zł. */
function unusualInvoices(currentIdxs){
  const monthNums=currentIdxs.map(i=>i+1);
  const purchase=invoices.filter(inv=>inv.type==='Zakup');
  /* WAŻNE: porównanie jest per-miesiąc, nie zsumowane za cały wybrany zakres — inaczej przy
     zakresie szerszym niż miesiąc (kwartał, półrocze...) zsumowalibyśmy kilka normalnych faktur
     tego samego dostawcy w jedną sztucznie dużą kwotę i fałszywie oznaczyli jako "nietypową".
     Chodzi o pojedynczą fakturę/miesiąc, który odstaje od POZOSTAŁYCH miesięcy tego dostawcy
     (np. zwykle 6-8 tys., nagle 15 tys.) — baza porównania to zawsze WSZYSTKIE inne miesiące z
     całej historii (nie tylko te poza wybranym zakresem), bo pytanie brzmi "czy ta konkretna
     faktura jest nietypowa dla tego kontrahenta", a nie "czy okres jest nietypowy". */
  const out=[];
  suppliers.forEach(s=>{
    currentIdxs.forEach(i=>{
      const monthAmount=Math.round(s.trend[i]*1000);
      if(monthAmount<=0)return;
      const otherIdxs=s.trend.map((_,j)=>j).filter(j=>j!==i&&s.trend[j]>0);
      if(!otherIdxs.length)return;
      const avgOther=Math.round(otherIdxs.reduce((sum,j)=>sum+s.trend[j],0)/otherIdxs.length*1000);
      if(avgOther>0&&monthAmount>avgOther*1.5){
        const repInv=purchase.filter(inv=>inv.party===s.name&&invoiceMonthNum(inv.date)===i+1).sort((a,b)=>b.net-a.net)[0];
        if(repInv)out.push({...repInv,net:monthAmount,reason:`${money(monthAmount)} w ${months[i]} — mocno powyżej typowej miesięcznej kwoty tego dostawcy (~${money(avgOther)})`});
      }
    });
  });
  /* "Nowy kontrahent" liczony z suppliers[].trend, nie z dat faktur — bo przy zakresie
     obejmującym cały dostępny okres (Styczeń→Czerwiec) KAŻDY dostawca ma swoją "pierwszą fakturę
     w historii" wewnątrz takiego zakresu, co fałszywie oznaczałoby wszystkich jako "nowych". Za
     nowego liczy się tylko dostawca, który nie istniał od stycznia (firstIdx>0) — w obecnych
     danych jedyny taki przypadek to CloudArch Backup. */
  const dateKey=d=>{const p=d.split('.');return p[2]+p[1]+p[0]};
  suppliers.forEach(s=>{
    const firstIdx=s.trend.findIndex(v=>v>0);
    if(firstIdx<=0||!currentIdxs.includes(firstIdx))return;
    const firstInv=purchase.filter(i=>i.party===s.name).sort((a,b)=>dateKey(a.date)<dateKey(b.date)?-1:1)[0];
    const amount=firstInv?firstInv.net:Math.round(s.trend[firstIdx]*1000);
    if(amount>10000)out.push({...(firstInv||{id:'',date:'',party:s.name,type:'Zakup',category:supplierCategoryOf(s.name)}),net:amount,reason:`Nowy kontrahent — pierwsza faktura ${money(amount)}`});
  });
  return out.sort((a,b)=>b.net-a.net);
}
/* Klik w słupek lub wiersz tabeli "Zestawienie kwotowe" → Faktury z gotowym filtrem: Typ=Zakup,
   ta konkretna kategoria (lub "Bez kategorii") i wszystkie miesiące z wybranego na Kosztach
   zakresu. Ten sam wzorzec co reużyty gdzie indziej — invoiceMultiSelect/toggleInvoiceFilter. */
function goToInvoicesFiltered(cat,currentIdxs){
  state.invoiceTypeFilter=['Zakup'];
  state.invoiceCategoryFilter=[cat];
  state.invoiceMonthFilter=currentIdxs.map(i=>String(i+1));
  state.invoiceSearch='';
  navigate('invoices');
  toast(`Filtr ustawiony: Zakup → ${cat}`);
}
function costsScreen(){
  const rk=state.costsRange,cm=state.costsCustomMonth;
  const{current}=rangeMonthIdx(rk,cm);
  const{rows:supplierRows}=supplierRangeStats(rk,cm);
  const costUp=supplierRows.filter(r=>r.change!==null&&r.change>0).sort((a,b)=>b.change-a.change);
  const costDown=supplierRows.filter(r=>r.change!==null&&r.change<0).sort((a,b)=>a.change-b.change);
  const newCosts=newRecurringCosts(current);
  const unusual=unusualInvoices(current);
  const rankMiniTable=(list,valFn,cls)=>`<table class="mini-table" style="margin-top:8px;width:100%;text-align:center"><thead><tr><th>Lp.</th><th>Nazwa</th><th>Zmiana</th></tr></thead><tbody>${list.slice(0,3).map((s,i)=>`<tr><td>${i+1}</td><td style="max-width:110px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${escapeHtml(s.name)}</td><td style="color:${cls}">${fmtPct(valFn(s))}</td></tr>`).join('')}</tbody></table>`;
  const amountMiniTable=list=>`<table class="mini-table" style="margin-top:8px;width:100%;text-align:center"><thead><tr><th>Lp.</th><th>Nazwa</th><th>Kwota</th></tr></thead><tbody>${list.slice(0,3).map((r,i)=>`<tr><td>${i+1}</td><td style="max-width:110px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${escapeHtml(r.name||r.party)}</td><td>${money(r.amount!==undefined?r.amount:r.net)}</td></tr>`).join('')}</tbody></table>`;
  const overflowBadge=n=>n>3?` <span class="info-tip" data-tip="Pokazano 3 najważniejsze z ${n} — pełną listę zobaczysz we Fakturach" style="color:var(--accent);font-weight:800">⚠</span>`:'';
  const tiles=`<div class="grid grid-4">
    <div class="card kpi" style="text-align:center">
      <div class="label">Wzrost cen</div>
      <div class="value" style="color:var(--danger)">${costUp.length}</div>
      ${costUp.length?rankMiniTable(costUp,s=>s.change,'var(--danger)'):`<div class="tiny-note" style="margin-top:6px">Brak wzrostów cen w tym okresie</div>`}
    </div>
    <div class="card kpi" style="text-align:center">
      <div class="label">Spadek cen</div>
      <div class="value" style="color:var(--success)">${costDown.length}</div>
      ${costDown.length?rankMiniTable(costDown,s=>s.change,'var(--success)'):`<div class="tiny-note" style="margin-top:6px">Brak spadków cen w tym okresie</div>`}
    </div>
    <div class="card kpi" style="text-align:center">
      <div class="label">Nowy koszt cykliczny${overflowBadge(newCosts.length)}</div>
      <div class="value">${newCosts.length}</div>
      ${newCosts.length?amountMiniTable(newCosts):`<div class="tiny-note" style="margin-top:6px">Brak nowych kosztów cyklicznych w tym okresie</div>`}
    </div>
    <div class="card kpi" style="text-align:center">
      <div class="label">Nietypowa faktura${overflowBadge(unusual.length)}</div>
      <div class="value" style="color:${unusual.length?'var(--danger)':'inherit'}">${unusual.length}</div>
      ${unusual.length?amountMiniTable(unusual.map(u=>({name:u.party,amount:u.net}))):`<div class="tiny-note" style="margin-top:6px">Brak nietypowych faktur w tym okresie</div>`}
    </div>
  </div>`;
  const{rows:catRows,total}=costCategoryTotals(current);
  const maxNet=Math.max(...catRows.map(r=>r.net),1);
  /* Słupki i podpisy kategorii są w DWÓCH osobnych wierszach flex, nie w jednej kolumnie —
     inaczej podpis kategorii zawijający się do 2 linijek (np. "Materiały produkcyjne") pcha cały
     bottom-justified blok (kwota+słupek+podpis) wyżej niż u sąsiada z jednolinijkowym podpisem, i
     słupki wizualnie "startują" z różnych wysokości mimo tej samej skali — dokładnie to Aleks
     zgłosił. Rozdzielenie na strefę słupków (stała wysokość, słupki zawsze siadają na tej samej
     linii) i osobny wiersz podpisów pod spodem to eliminuje. */
  const barZone=`<div style="display:flex;align-items:flex-end;gap:14px;height:210px;padding:10px 4px 0">${catRows.map(r=>{
    const isNoCat=r.category==='Bez kategorii';
    const h=Math.round(r.net/maxNet*180);
    return `<div style="flex:1;min-width:64px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;cursor:pointer" onclick="goToInvoicesFiltered('${r.category.replace(/'/g,"\\'")}',${JSON.stringify(current)})">
      <div class="tiny-note" style="font-weight:700;white-space:nowrap">${isNoCat?'⚠ ':''}${money(r.net)}</div>
      <div style="width:34px;height:${h}px;background:${isNoCat?'var(--accent)':'var(--danger)'};border-radius:6px 6px 0 0;margin-top:4px"></div>
    </div>`
  }).join('')}</div>`;

function suppliersRangeSelect(){

/* Statystyki dostawców dla wybranego zakresu — dokładnie ten sam mechanizm co clientRangeStats,
   tylko z tablicy suppliers (trend to miesięczne koszty zakupu, nie sprzedaż). */
function supplierRangeStats(range,customMonth){
  customMonth=customMonth===undefined?state.suppliersCustomMonth:customMonth;
  const{current,previous}=rangeMonthIdx(range,customMonth);
  const currentMonthNums=current.map(i=>i+1);
  const sumTrend=(s,idxs)=>idxs.reduce((sum,i)=>sum+(s.trend[i]||0),0)*1000;
  const rows=suppliers.map(s=>{
    const curVal=sumTrend(s,current);
    const prevVal=previous?sumTrend(s,previous):null;
    const change=(prevVal!==null&&prevVal>0)?(curVal-prevVal)/prevVal*100:null;
    const invoiceCount=invoices.filter(inv=>inv.type==='Zakup'&&inv.party===s.name&&currentMonthNums.includes(invoiceMonthNum(inv.date))).length;
    return{...s,curVal,prevVal,change,invoiceCount};
  });
  const totalCur=rows.reduce((sum,r)=>sum+r.curVal,0);
  const totalPrev=previous?rows.reduce((sum,r)=>sum+(r.prevVal||0),0):0;
  rows.forEach(r=>{r.shareCur=totalCur?r.curVal/totalCur*100:0;r.sharePrev=(previous&&totalPrev)?(r.prevVal||0)/totalPrev*100:null});
  return{rows,totalCur}
}
/* Dla dostawców rosnący koszt to zły sygnał (na odwrót niż u klientów, gdzie rosnąca sprzedaż
   jest dobra) — dlatego status jest odwrócony względem clientStatus: wzrost kosztu = "Wymaga
   uwagi" (czerwony), spadek = "Tanieje" (zielony), bez zmiany = "Stabilny" (niebieski). */
function supplierStatus(r){if(r.change===null)return{label:'Brak porównania',cls:'gray'};if(r.change>0)return{label:'Wymaga uwagi',cls:'red'};if(r.change<0)return{label:'Tanieje',cls:'green'};return{label:'Stabilny',cls:'blue'}}
function setSuppliersSearch(v){state.suppliersSearch=v;render()}
function setSuppliersSort(key){if(state.suppliersSort.key===key)state.suppliersSort.dir=state.suppliersSort.dir==='asc'?'desc':'asc';else state.suppliersSort={key,dir:key==='name'||key==='status'?'asc':'desc'};render()}
function filteredSortedSupplierRows(rows){
  let list=rows;
  if(state.suppliersSearch){const q=state.suppliersSearch.toLowerCase();list=list.filter(r=>r.name.toLowerCase().includes(q))}
  const{key,dir}=state.suppliersSort;
  list=list.slice().sort((a,b)=>{
    let va,vb;
    if(key==='name'){va=a.name.toLowerCase();vb=b.name.toLowerCase()}
    else if(key==='status'){va=supplierStatus(a).label;vb=supplierStatus(b).label}
    else{va=a[key]===null?-Infinity:a[key];vb=b[key]===null?-Infinity:b[key]}
    if(va<vb)return dir==='asc'?-1:1;
    if(va>vb)return dir==='asc'?1:-1;
    return 0
  });
  return list
}

      <div style="height:84px;width:26px;background:var(--border);border-radius:6px;margin:10px auto 0;position:relative;overflow:hidden"><div style="position:absolute;bottom:0;left:0;right:0;height:${biggest?biggest.shareCur:0}%;background:var(--accent);border-radius:6px 6px 0 0"></div></div>

  return shell(`<div class="page-header" style="display:grid;grid-template-columns:200px 1fr 200px;align-items:flex-start;gap:20px">${toolbar}<div style="text-align:center"><h1>Dostawcy</h1><p>Którzy dostawcy mają największy wpływ na koszty Twojej firmy.</p></div><div></div></div>${analysisNav('suppliers')}${tiles}${table}`,'analysis')

function rangeMonthIdx(range,customMonth){
  const last=months.length-1;
  if(range==='month')return{current:[last],previous:last-1>=0?[last-1]:null,label:'bieżący miesiąc'};
  if(range==='lastMonth')return{current:last-1>=0?[last-1]:[last],previous:last-2>=0?[last-2]:null,label:'ostatni miesiąc'};
  if(range==='quarter'){const cur=[Math.max(0,last-2),Math.max(0,last-1),last].filter((v,i,a)=>a.indexOf(v)===i);const prevStart=cur[0]-3;const prev=prevStart>=0?[prevStart,prevStart+1,prevStart+2]:null;return{current:cur,previous:prev,label:'kwartał'}}
  if(range==='custom'){const mi=Math.max(0,Math.min(last,Number(customMonth)));return{current:[mi],previous:mi-1>=0?[mi-1]:null,label:months[mi]}}
  return{current:months.map((_,i)=>i),previous:null,label:'dostępny zakres (6 mies.)'};
}
function sumIdx(arr,idxs){return idxs.reduce((s,i)=>s+arr[i],0)}
function todayMetrics(range,customMonth){
  customMonth=customMonth===undefined?state.todayCustomMonth:customMonth;
  const{current,previous}=rangeMonthIdx(range,customMonth);
  const rev=sumIdx(sales,current)*1000,cost=sumIdx(costs,current)*1000,taxV=sumIdx(tax,current)*1000;
  const inc=rev-cost-taxV;
  const margin=rev?inc/rev*100:0;
  let prev=null;
  if(previous){
    const pRev=sumIdx(sales,previous)*1000,pCost=sumIdx(costs,previous)*1000,pTax=sumIdx(tax,previous)*1000;
    const pInc=pRev-pCost-pTax;
    prev={rev:pRev,cost:pCost,tax:pTax,inc:pInc,margin:pRev?pInc/pRev*100:0}
  }
  return{current,previous,rev,cost,tax:taxV,inc,margin,prev}
}

  return `${label} ${dir} o ${Math.abs(trend).toFixed(1).replace('.',',')}${unit} ${cmp}.`
}
function catmullRomPath(pts){
  if(pts.length<2)return'';
  if(pts.length===2)return`M${pts[0].x},${pts[0].y} L${pts[1].x},${pts[1].y}`;
  let d=`M${pts[0].x},${pts[0].y}`;
  for(let i=0;i<pts.length-1;i++){
    const p0=pts[i-1]||pts[i],p1=pts[i],p2=pts[i+1],p3=pts[i+2]||p2;
    const c1x=p1.x+(p2.x-p0.x)/6,c1y=p1.y+(p2.y-p0.y)/6;
    const c2x=p2.x-(p3.x-p1.x)/6,c2y=p2.y-(p3.y-p1.y)/6;
    d+=` C${c1x.toFixed(1)},${c1y.toFixed(1)} ${c2x.toFixed(1)},${c2y.toFixed(1)} ${p2.x.toFixed(1)},${p2.y.toFixed(1)}`
  }
  return d
}
function strHash(s){let h=0;for(let i=0;i<s.length;i++){h=(h*31+s.charCodeAt(i))|0}return Math.abs(h)}
function waveExpand(values,seed){
  if(values.length!==2)return values;
  const[a,b]=values;
  const amp=Math.max(Math.abs(b-a),Math.abs(a)*0.06,Math.abs(b)*0.06,0.4)*0.3;
  const lerp=t=>a+(b-a)*t;
  const shapes=[
    [lerp(0.25)+amp*0.85,lerp(0.5)+amp*0.25,lerp(0.75)-amp*0.35],
    [lerp(0.25)-amp*0.65,lerp(0.5)+amp*0.15,lerp(0.75)+amp*0.55],
    [lerp(0.25)+amp*0.5,lerp(0.5)-amp*0.45,lerp(0.75)+amp*0.3],
    [lerp(0.25)-amp*0.25,lerp(0.5)-amp*0.6,lerp(0.75)-amp*0.1]
  ];
  const mid=shapes[seed?strHash(String(seed))%shapes.length:0];
  return[a,mid[0],mid[1],mid[2],b]
}
function dataSpark(values,color,seed){
  if(!values||values.length<2)return lineSpark(color);
  const plot=waveExpand(values,seed);
  const w=120,h=42,padX=4,padTop=5,padBottom=9;
  const min=Math.min(...plot),max=Math.max(...plot);
  const range=(max-min)||1;
  const step=(w-2*padX)/(plot.length-1);
  const pts=plot.map((v,i)=>({x:padX+i*step,y:padTop+(1-(v-min)/range)*(h-padTop-padBottom)}));
  return `<svg viewBox="0 0 ${w} ${h}"><path d="${catmullRomPath(pts)}" fill="none" stroke="${color}" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><line x1="${padX}" y1="${h-3}" x2="${w-padX}" y2="${h-3}" stroke="#E8EDF3" stroke-width="1"/></svg>`
}

  return current.map(marginAt)
}
function todayBarChart(range){

  const barW=Math.min(22,(groupW-gap*3)/4);
  let bars='',labels='';
  current.forEach((mi,gi)=>{
    const gx=padL+gi*groupW+(groupW-(barW*4+gap*3))/2;
    series.forEach((s,si)=>{
      const val=s.data[gi];
      const bh=(val/maxVal)*(h-padT-padB);
      const bx=gx+si*(barW+gap);
      const by=h-padB-bh;
      bars+=`<rect x="${bx.toFixed(1)}" y="${by.toFixed(1)}" width="${barW.toFixed(1)}" height="${Math.max(1,bh).toFixed(1)}" rx="2" fill="${s.color}"/>`
    });
    labels+=`<text x="${(gx+(barW*4+gap*3)/2).toFixed(1)}" y="${h-6}" font-size="10" fill="#8398AE" text-anchor="middle">${months[mi]}</text>`
  });
  const legend=`<div class="bar-legend">${series.map(s=>`<span><i style="background:${s.color}"></i>${s.label}</span>`).join('')}</div>`;
  return legend+`<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:200px"><line x1="${padL}" y1="${h-padB}" x2="${w-padL}" y2="${h-padB}" stroke="#E8EDF3"/>${bars}${labels}</svg>`
}

/* Wykres Sprzedaż i koszty na zakładce Firma — liczony z rzeczywistych faktur (nie z ozdobnej,
   losowej krzywej), zawsze rozbity na kubełki po realnych dniach wystawienia — nigdy jeden punkt
   na miesiąc, bo to robi płaską, mało czytelną linię. Pojedynczy miesiąc (Obecny/Ostatni/Własny
   zakres) dzielimy na ~tygodnie (4 kubełki), a każdy miesiąc w dłuższym zakresie (kwartał, półrocze,
   rok) dodatkowo na dwie połówki (~dwa tygodnie), więc kwartał daje 6 punktów, półrocze/rok — 12. */
function trendBuckets(range,customMonth){
  customMonth=customMonth===undefined?state.analysisCustomMonth:customMonth;
  const{current}=rangeMonthIdx(range,customMonth);
  const perMonth=current.length<=1?4:2;
  const buckets=[];
  current.forEach(mi=>{
    const monthNum=mi+1;
    const daysInMonth=new Date(2026,monthNum,0).getDate();
    const bucketSize=Math.ceil(daysInMonth/perMonth);
    for(let i=0;i<perMonth;i++){
      const startDay=i*bucketSize+1,endDay=Math.min(daysInMonth,(i+1)*bucketSize);
      if(startDay>daysInMonth)continue;
      buckets.push({month:mi,startDay,endDay,label:startDay===endDay?`${startDay}`:`${startDay}–${endDay}`,sales:0,costs:0});
    }
  });
  invoices.forEach(inv=>{
    const[d,mm]=inv.date.split('.').map(Number);
    const mi=mm-1;
    const b=buckets.find(bk=>bk.month===mi&&d>=bk.startDay&&d<=bk.endDay);
    if(!b)return;
    if(inv.type==='Sprzedaż')b.sales+=inv.net;else b.costs+=inv.net;
  });
  return buckets;
}
function trendChart(range,customMonth){
  const buckets=trendBuckets(range,customMonth);
  const w=600,h=220,padL=48,padR=10,padT=16,padB=28;
  const maxVal=Math.max(...buckets.map(b=>Math.max(b.sales,b.costs)),1);
  const niceMax=Math.ceil(maxVal/50000)*50000||50000;
  const n=buckets.length;
  const stepX=n>1?(w-padL-padR)/(n-1):0;
  const xFor=i=>n>1?padL+i*stepX:padL+(w-padL-padR)/2;
  const yFor=v=>padT+(1-v/niceMax)*(h-padT-padB);
  const base=h-padB;
  const salesPts=buckets.map((b,i)=>({x:xFor(i),y:yFor(b.sales)}));
  const costsPts=buckets.map((b,i)=>({x:xFor(i),y:yFor(b.costs)}));
  const gridCount=4;
  let grid='';
  for(let g=0;g<=gridCount;g++){
    const val=niceMax*g/gridCount;
    const y=yFor(val);
    grid+=`<line x1="${padL}" y1="${y.toFixed(1)}" x2="${w-padR}" y2="${y.toFixed(1)}" stroke="#E8EDF3" stroke-width="1"/><text x="${(padL-8).toFixed(1)}" y="${(y+3).toFixed(1)}" font-size="9" fill="#8398AE" text-anchor="end">${Math.round(val/1000)} tys.</text>`;
  }
  const axisX=`<line x1="${padL}" y1="${base.toFixed(1)}" x2="${w-padR}" y2="${base.toFixed(1)}" stroke="#CBD5E1" stroke-width="1"/>`;
  const monthsSpanned=new Set(buckets.map(b=>b.month)).size;
  let xLabels='';
  if(monthsSpanned>1){
    const groups={};
    buckets.forEach((b,i)=>{(groups[b.month]=groups[b.month]||[]).push(xFor(i))});
    xLabels=Object.entries(groups).map(([mi,xs])=>{const avgX=xs.reduce((a,c)=>a+c,0)/xs.length;return `<text x="${avgX.toFixed(1)}" y="${h-8}" font-size="10" fill="#8398AE" text-anchor="middle">${months[mi]}</text>`}).join('');
  }else{
    xLabels=buckets.map((b,i)=>`<text x="${xFor(i).toFixed(1)}" y="${h-8}" font-size="10" fill="#8398AE" text-anchor="middle">${b.label}</text>`).join('');
  }
  const salesLine=salesPts.length>1?catmullRomPath(salesPts):'';
  const salesArea=salesLine?`${salesLine} L${salesPts[salesPts.length-1].x.toFixed(1)},${base.toFixed(1)} L${salesPts[0].x.toFixed(1)},${base.toFixed(1)} Z`:'';
  const costsLine=costsPts.length>1?catmullRomPath(costsPts):'';
  const singlePoint=n===1?`<circle cx="${salesPts[0].x.toFixed(1)}" cy="${salesPts[0].y.toFixed(1)}" r="4" fill="var(--primary)"/><circle cx="${costsPts[0].x.toFixed(1)}" cy="${costsPts[0].y.toFixed(1)}" r="4" fill="var(--danger)"/>`:'';
  const legend=`<div class="bar-legend"><span><i style="background:var(--primary)"></i>Sprzedaż</span><span><i style="background:var(--danger)"></i>Koszty</span></div>`;
  const svg=`<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:222px"><defs><linearGradient id="trendGrad" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--primary)" stop-opacity=".18"/><stop offset="1" stop-color="var(--primary)" stop-opacity="0"/></linearGradient></defs>${grid}${axisX}${salesArea?`<path d="${salesArea}" fill="url(#trendGrad)"/>`:''}${salesLine?`<path d="${salesLine}" fill="none" stroke="var(--primary)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>`:''}${costsLine?`<path d="${costsLine}" fill="none" stroke="var(--danger)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>`:''}${singlePoint}${xLabels}</svg>`;
  return legend+svg;
}

/* Działania powstają automatycznie z decyzji — tak jak w realnym produkcie: gdy pojawia się
   aktywna decyzja, jej proponowane kroki od razu trafiają na kanban w Działaniach. */
/* Temperatura działania dziedziczy się po wadze decyzji, z której powstało:
   blokująca/wysoki priorytet → gorące, średni → ciepłe, niski → zimne. */
function priorityToTemp(d){
  if(d.priority==='Blokująca'||d.priority==='Wysoki')return'gorące';
  if(d.priority==='Średni')return'ciepłe';
  return'zimne';
}
/* Tylko pierwsza sugerowana akcja z każdej aktywnej decyzji trafia automatycznie do Działań.
   Kolejne (2., 3.) czekają jako rekomendacje do zaakceptowania w oknie decyzji. */
(function seedActionsFromDecisions(){
  decisions.forEach(d=>{
    if(d.status==='Zamknięte')return;
    const sa=(d.suggestedActions||[])[0];if(!sa)return;
    if(state.actions.some(a=>a.decisionId===d.id&&a.title===sa.title))return;
    const due=new Date(Date.now()+(sa.days||0)*86400000).toLocaleDateString('pl-PL',{day:'numeric',month:'long',year:'numeric'});
    state.actions.push({title:sa.title,status:'todo',due,source:d.title,decisionId:d.id,temp:priorityToTemp(d),note:''});
  });
  const inProgress=['Zweryfikuj telefonicznie zmianę numeru konta u Metal-Okuć S.C.','Porównaj oferty DrewnoPol i Akcesoria XYZ'];
  state.actions.forEach(a=>{if(inProgress.includes(a.title))a.status='doing'});
})();
function pendingSuggestions(d){return(d.suggestedActions||[]).slice(1).filter(sa=>!state.actions.some(a=>a.decisionId===d.id&&a.title===sa.title))}
function acceptSuggestedAction(decisionId,title){
  const d=decisions.find(x=>x.id===decisionId);if(!d)return;
  const sa=(d.suggestedActions||[]).find(s=>s.title===title);if(!sa)return;
  if(state.actions.some(a=>a.decisionId===decisionId&&a.title===title))return;
  const due=new Date(Date.now()+(sa.days||0)*86400000).toLocaleDateString('pl-PL',{day:'numeric',month:'long',year:'numeric'});
  state.actions.unshift({title:sa.title,status:'todo',due,source:d.title,decisionId,temp:priorityToTemp(d),note:''});

function daysSinceStr(dateStr){if(!dateStr)return null;return(Date.now()-new Date(dateStr).getTime())/86400000}

function archiveCountdown(d){if(!d.closedAt)return null;const msLeft=Math.max(0,GRACE_MS-(Date.now()-new Date(d.closedAt).getTime()));const days=Math.floor(msLeft/86400000),hours=Math.floor((msLeft%86400000)/3600000);return days>0?days+' dni '+hours+' godz':hours+' godz'}
function activeDecisions(){return decisions.filter(d=>d.status!=='Zamknięte')}
function closedDecisions(){return decisions.filter(d=>d.status==='Zamknięte'&&!isArchived(d)).sort((a,b)=>(b.closedAt||'').localeCompare(a.closedAt||''))}

const CATEGORY_OPTIONS=['Materiały produkcyjne','Artykuły biurowe','Artykuły gospodarcze','Media','Najem','Subskrypcja','Usł. telekomunikacyjna','Usługa serwisowa','Usługi obce','Wyposażenie','Inne'];
const SALES_CATEGORY='Sprzedaż wyrobów gotowych';

function seededRng(seedStr){let h=1779033703^seedStr.length;for(let i=0;i<seedStr.length;i++){h=Math.imul(h^seedStr.charCodeAt(i),3432918353);h=h<<13|h>>>19}return function(){h=Math.imul(h^h>>>16,2246822519);h=Math.imul(h^h>>>13,3266489917);h=(h^=h>>>16)>>>0;return h/4294967296}}
function splitAmount(total,rng){let n;const r=rng();n=r<0.5?1:(r<0.85?2:3);if(total<250)n=1;if(n===1)return[total];const cuts=[];for(let i=0;i<n-1;i++)cuts.push(1+Math.floor(rng()*(total-1)));cuts.sort((a,b)=>a-b);const parts=[];let prev=0;for(const c of cuts){parts.push(Math.max(1,c-prev));prev=c}parts.push(total-prev);return parts.filter(p=>p>0).length===n?parts:[total]}

function generateSalesInvoices(){
  const kindByClient={meblodom:'Dostawa mebli do sieci sklepów',debowski:'Zamówienie hurtowe — asortyment standardowy',concept:'Meble na wymiar — projekt wnętrz',klasyka:'Dostawa do salonu meblowego',serenity:'Wyposażenie pokoi hotelowych',zielonetarasy:'Wyposażenie mieszkań deweloperskich',mebloklik:'Zamówienie e-commerce — wysyłka bezpośrednia',loft:'Meble na wymiar — projekt architektoniczny',antresola:'Zamówienie — meble biurowe',aurora:'Pierwsze zamówienie — kolekcja podstawowa',wnetrzastyl:'Zamówienie — asortyment butikowy',sielanka:'Zamówienie — kolekcja ogrodowa'};
  const out=[];let seq=1;
  for(let mi=0;mi<6;mi++){
    clients.forEach(c=>{
      const totalNet=Math.round(c.trend[mi]*1000);
      const rng=seededRng(`sale-${c.id}-${mi}`);
      const parts=splitAmount(totalNet,rng);
      const mm=String(mi+1).padStart(2,'0');
      parts.forEach((net,k)=>{
        const vat=Math.round(net*0.23*100)/100;
        const gross=Math.round((net+vat)*100)/100;
        const day=String(3+((seq*5+k*7)%25)).padStart(2,'0');
        const kindBase=kindByClient[c.id]||'Dostawa mebli — zamówienie standardowe';
        const kind=parts.length>1?`${kindBase} (część ${k+1}/${parts.length})`:kindBase;
        out.push({id:`FV/${mm}/2026/${150+seq}`,type:'Sprzedaż',party:c.name,date:`${day}.${mm}.2026`,net,vat,gross,kind,status:'KSeF przyjęta',category:SALES_CATEGORY});
        seq++
      })
    });
  }
  return out
}

function generatePurchaseInvoices(){
  const kindByType={drewnopol:'Dostawa drewna litego i płyt meblowych',akcesoriaxyz:'Okucia, zawiasy i prowadnice',systechr:'Licencja systemu planowania produkcji',biuropartner:'Materiały biurowe',packpro:'Opakowania i folia ochronna',lakiernia:'Lakiery i środki wykończeniowe',serwistech:'Przegląd i serwis maszyn stolarskich',transmeb:'Transport wyrobów gotowych',tapicernia:'Tkaniny i pianki tapicerskie',klejmax:'Kleje i chemia przemysłowa',cloudarch:'Backup danych w chmurze — nowa subskrypcja'};
  const categoryByType={drewnopol:'Materiały produkcyjne',akcesoriaxyz:'Materiały produkcyjne',systechr:'Subskrypcja',biuropartner:'Artykuły biurowe',packpro:'Artykuły gospodarcze',lakiernia:'Materiały produkcyjne',serwistech:'Usługa serwisowa',transmeb:'Usługi obce',tapicernia:'Materiały produkcyjne',klejmax:'Materiały produkcyjne',cloudarch:'Subskrypcja'};
  const out=[];let seq=1;
  for(let mi=0;mi<6;mi++){
    suppliers.forEach(s=>{
      const totalNet=Math.round(s.trend[mi]*1000);
      if(totalNet<=0)return; /* cloudarch nie istnieje przed czerwcem — nie generujemy pustych faktur 0 zł */
      const rng=seededRng(`cost-${s.id}-${mi}`);
      const parts=splitAmount(totalNet,rng);
      const mm=String(mi+1).padStart(2,'0');
      const isExampleMonth=mi===5&&s.id==='drewnopol';
      parts.forEach((net,k)=>{
        const vat=Math.round(net*0.23*100)/100;
        const gross=Math.round((net+vat)*100)/100;
        const day=String(4+((seq*3+k*11)%24)).padStart(2,'0');
        const kindBase=kindByType[s.id]||'Dostawa wg umowy';
        const kind=parts.length>1?`${kindBase} (część ${k+1}/${parts.length})`:kindBase;
        const isExample=isExampleMonth&&k===0;
        out.push({id:`KOS/${mm}/2026/${50+seq}`,type:'Zakup',party:s.name,date:`${day}.${mm}.2026`,net,vat,gross,kind,status:'KSeF odebrana',category:isExample?'':(categoryByType[s.id]||'')});
        seq++
      })
    });
  }
  return out
}

function analysisNav(active){const tabs=[['analysis','Firma'],['detail','Zestawienie szczegółowe'],['clients','Klienci'],['suppliers','Dostawcy'],['costs','Koszty'],['market','Rynek i benchmarki'],['scenarios','Co jeśli?']];return `<div class="analysis-tabs">${tabs.map(([r,l])=>`<button class="${active===r?'active':''}" onclick="navigate('${r}')">${l}</button>`).join('')}</div>`}
function analysisScreen(){
  const rk=state.analysisRange,cm=state.analysisCustomMonth;
  const m=todayMetrics(rk,cm);
  const revTr=pctChange(m.rev,m.prev&&m.prev.rev),costTr=pctChange(m.cost,m.prev&&m.prev.cost),taxTr=pctChange(m.tax,m.prev&&m.prev.tax),incTr=pctChange(m.inc,m.prev&&m.prev.inc);
  const marginPP=m.prev?m.margin-m.prev.margin:null;
  /* Dynamika sprzedaży — realny % liczony z naszych danych (tablica sales, czyli suma faktur
     sprzedażowych), pierwszy miesiąc dostępnej historii vs ostatni. Punkt odniesienia z GUS
     (produkcja sprzedana, branża meblarska PKD 31) nie jest z podłączonego źródła — szacujemy go,
     bo nie mamy integracji z GUS, i wprost to podpisujemy, żeby nie wyglądało na twardą daną. */
  const salesGrowthPct=(sales[sales.length-1]-sales[0])/sales[0]*100;
  /* Marża w karcie "Kontekst rynkowy" — spójna z zakładką Rynek i benchmarki (marketScreen()):
     liczona zawsze z CAŁEGO dostępnego okresu (Sty–Cze), niezależnie od wybranego tu zakresu rk,
     dokładnie tą samą formułą co marketScreen (sumIdx sales/costs/tax), żeby liczba widoczna tu
     i na Rynku zawsze się zgadzała co do dziesiątej procenta. */
  const idxsFull=months.map((_,i)=>i);
  const revVFull=sumIdx(sales,idxsFull)*1000,costVFull=sumIdx(costs,idxsFull)*1000,taxVFull=sumIdx(tax,idxsFull)*1000;
  const marginPctFull=revVFull?(revVFull-costVFull-taxVFull)/revVFull*100:0;
  const toolbar=`<div class="today-toolbar"><button class="btn btn-secondary btn-sm" style="width:100%" onclick="printReport()">Eksportuj podsumowanie PDF</button>${analysisRangeSelect()}</div>`;
  return shell(`<div class="page-header" style="display:grid;grid-template-columns:200px 1fr 200px;align-items:flex-start;gap:20px">${toolbar}<div style="text-align:center"><h1>Analiza firmy</h1><p>Najpierw interpretacja, potem dane.</p></div><div></div></div>${analysisNav('analysis')}<div class="grid grid-5">${kpiCard('Przychód',money(m.rev),revTr===null?'—':fmtPct(revTr),(revTr||0)>=0?'up':'down','var(--success)',todaySparkValues(rk,sales,cm),sparkTip('Przychód',revTr,rk))}${kpiCard('Koszt',money(m.cost),costTr===null?'—':fmtPct(costTr),(costTr||0)<=0?'up':'down','var(--danger)',todaySparkValues(rk,costs,cm),sparkTip('Koszt',costTr,rk))}${kpiCard('Szac. podatek',money(m.tax),taxTr===null?'—':fmtPct(taxTr),(taxTr||0)<=0?'up':'down','var(--accent)',todaySparkValues(rk,tax,cm),sparkTip('Szacowany podatek',taxTr,rk))}${kpiCard('Szac. dochód',money(m.inc),incTr===null?'—':fmtPct(incTr),(incTr||0)>=0?'up':'down','var(--primary)',todaySparkValues(rk,income,cm),sparkTip('Szacowany dochód',incTr,rk))}${kpiCard('Marża',m.margin.toFixed(1).replace('.',',')+'%',marginPP===null?'—':(marginPP>0?'+':'')+marginPP.toFixed(1).replace('.',',')+' pp',(marginPP||0)>=0?'up':'down','#8997A8',todayMarginSparkValues(rk,cm),sparkTip('Marża',marginPP,rk,' pp'))}</div><div class="grid grid-2" style="margin-top:16px"><div class="card"><div class="card-title">Sprzedaż i koszty — ${rangeOptionLabel(rk,cm).toLowerCase()}</div><div class="chart-box" style="height:280px">${trendChart(rk,cm)}</div></div><div class="market-context"><div style="display:flex;align-items:baseline;justify-content:space-between;gap:10px"><h3 style="margin:0">Kontekst rynkowy</h3><span class="tiny-note">Dane za dostępny okres (Sty–Cze 2026)</span></div><div style="margin-top:10px"><div class="market-row"><span>Koszty materiałów</span><span class="mine">${fmtPct(materialsCostGrowthPct())}</span><span class="market">GUS/PPI (szac.) +7,2%</span></div><div class="market-row"><span>Dynamika sprzedaży</span><span class="mine">${fmtPct(salesGrowthPct)}</span><span class="market">branża meblarska (GUS, szac.) +4,8%</span></div><div class="market-row"><span>Marża</span><span class="mine">${(marginPctFull>=0?'+':'')+marginPctFull.toFixed(1).replace('.',',')+'%'}</span><span class="market">branża meblarska (GUS, szac.) ~21%</span></div></div><button class="btn btn-secondary btn-sm" style="margin-top:12px" onclick="navigate('market')">Pokaż dane rynkowe →</button></div></div>`,'analysis')
}
/* Zestawienie szczegółowe — miesięczne i narastające podsumowanie przychodu/kosztu/składki ZUS/
   podstawy opodatkowania/podatku, liczone z jedynego źródła prawdy (sales/costs). Składka
   społeczna (ZUS) to świadome uproszczenie makiety, ustalone z Aleksem — stała kwota
   ZUS_MONTHLY zł/mies. Podstawa opodatkowania = (Przychód - Koszt) - Składka społeczna.
   Podatek = 19% × Podstawa opodatkowania NARASTAJĄCO (nie suma zaokrąglonych podatków
   miesięcznych — liczymy od razu na skumulowanej podstawie, żeby uniknąć błędu zaokrągleń).
   Uwaga: to CELOWO inna metoda niż tablica tax[] używana na Start/Firma (tam podatek to ok. 19%
   z Przychód-Koszt PRZED odjęciem ZUS, zaszyte na sztywno, bez związku z podstawą opodatkowania
   pokazaną w tej tabeli) — na wyraźną prośbę Aleksa podatek w tym zestawieniu liczy się wprost
   z widocznej obok Podstawy opodatkowania, więc będzie się nieznacznie różnić od "Szac. podatku"
   na innych zakładkach. Podobnie "Dochód" tu (Przychód-Koszt, przed opodatkowaniem) to inna
   wielkość niż tablica income[] (już PO odjęciu podatku) używana gdzie indziej. */
const ZUS_MONTHLY=3000;
const DETAIL_TAX_RATE=0.19;
function detailStatementScreen(){
  const rows=months.map((m,i)=>{
    const revenue=sales[i]*1000;
    const cost=costs[i]*1000;
    const grossIncome=revenue-cost;
    const zus=ZUS_MONTHLY;
    const taxBase=grossIncome-zus;
    const monthLabel=String(i+1).padStart(2,'0')+'.26';
    return{monthLabel,revenue,cost,grossIncome,zus,taxBase};
  });
  let cRevenue=0,cCost=0,cZus=0,cTaxBase=0;
  /* Podatek zapłacony/do zapłaty — model zaliczki z jednomiesięcznym przesunięciem: to, co
     "zapłacone" w danym miesiącu, to suma tego, co było zapłacone i należne w miesiącu
     POPRZEDNIM (płacimy zaliczkę za miesiąc N w miesiącu N+1). "Podatek do zapłaty" w danym
     miesiącu to różnica między podatkiem narastająco a tym, co już zapłacono — nigdy poniżej 0. */
  let paidSoFar=0;
  const cumRows=rows.map(r=>{
    cRevenue+=r.revenue;cCost+=r.cost;cZus+=r.zus;cTaxBase+=r.taxBase;
    const cTax=Math.round(Math.max(0,cTaxBase)*DETAIL_TAX_RATE);
    const paid=Math.max(0,paidSoFar);
    const due=Math.max(0,cTax-paid);
    paidSoFar=paid+due;
    return{...r,cRevenue,cCost,cZus,cTaxBase,cTax,paid,due};
  });
  const money0=v=>Math.round(v).toLocaleString('pl-PL')+' zł';
  /* Miesiąc "w trakcie" — ostatni dostępny miesiąc w danych (na potrzeby makiety: Czerwiec,
     ostatni indeks tablicy months). Wiersz dostaje delikatnie inne tło (.in-progress-row) oraz
     dymek przy dacie z etykietą "w trakcie" — ten sam mechanizm dymka co przy sparkline w KPI
     (.spark[data-tip]), tylko wydzielony do uniwersalnej klasy .info-tip, żeby dało się go użyć
     poza kartami KPI. */
  const inProgressIdx=months.length-1;
  /* Filtr miesięcy w toolbarze — steruje WYŁĄCZNIE tym, które wiersze są widoczne w tabeli.
     Kolumny "Narastająco" i rozliczenie podatku są liczone raz, na pełnym zakresie Sty→Cze,
     zanim zastosujemy filtr — inaczej zaznaczenie np. tylko marca dawałoby mylące "narastająco"
     liczone tylko z marca zamiast realnej sumy od początku roku. */
  const monthOptions=months.map((m,i)=>({v:String(i+1),l:m}));
  const monthFilter=state.invoiceDetailMonthFilter;
  const visibleRows=monthFilter.length?cumRows.filter((r,i)=>monthFilter.includes(String(i+1))):cumRows;
  const toolbar=`<div class="today-toolbar" style="display:flex;flex-direction:column;gap:14px"><button class="btn btn-secondary btn-sm" style="width:100%" onclick="printReport()">Eksportuj podsumowanie PDF</button>${invoiceMultiSelect('DetailMonth','Miesiąc',monthOptions,'Wszystkie miesiące')}</div>`;
  const table=`<div class="card table-card" style="margin-top:16px"><div class="table-head"><b>Zestawienie miesięczne i narastające</b><span class="tiny-note">Sty–Cze 2026 · liczone z faktur sprzedażowych i zakupowych</span></div><div class="table-wrap-scroll"><table class="detail-table">
    <thead>
      <tr class="group-row"><th></th><th colspan="3">Miesiąc</th><th colspan="5">Narastająco</th><th colspan="2">Rozliczenie podatku</th></tr>
      <tr><th>Miesiąc</th><th>Przychód</th><th>Koszt</th><th>Składka ZUS</th><th>Przychód</th><th>Koszt</th><th>Składka ZUS</th><th>Podstawa opod.</th><th>Podatek</th><th>Podatek zapłacony</th><th>Podatek do zapłaty</th></tr>
    </thead>
    <tbody>
      ${visibleRows.length?visibleRows.map((r,vi)=>{const i=cumRows.indexOf(r);const inProgress=i===inProgressIdx;return `<tr${inProgress?' class="in-progress-row"':''}><td><b>${r.monthLabel}</b>${inProgress?` <span class="info-tip" data-tip="Dane za ten miesiąc są jeszcze niekompletne" style="font-size:10px;font-weight:700;color:var(--accent);background:var(--accent-soft);padding:2px 7px;border-radius:999px;vertical-align:middle">w trakcie</span>`:''}</td><td>${money0(r.revenue)}</td><td>${money0(r.cost)}</td><td>${money0(r.zus)}</td><td>${money0(r.cRevenue)}</td><td>${money0(r.cCost)}</td><td>${money0(r.cZus)}</td><td>${money0(r.cTaxBase)}</td><td>${money0(r.cTax)}</td><td>${money0(r.paid)}</td><td>${money0(r.due)}</td></tr>`}).join(''):`<tr><td colspan="11" class="empty-row">Brak miesięcy pasujących do filtra.</td></tr>`}
    </tbody>
  </table></div></div>`;
  return shell(`<div class="page-header" style="display:grid;grid-template-columns:200px 1fr 200px;align-items:flex-start;gap:20px">${toolbar}<div style="text-align:center"><h1>Zestawienie szczegółowe</h1><p>Miesięczny i narastający obraz wyniku firmy — jedna tabela, wszystkie liczby.</p></div><div></div></div>${analysisNav('detail')}<div class="system-note">Składka społeczna (ZUS) przyjęta na potrzeby makiety jako stała kwota ${money0(ZUS_MONTHLY)}/mies. — nie jest to dane z KSeF ani rzeczywista deklaracja. Podatek = ${(DETAIL_TAX_RATE*100).toFixed(0)}% × Podstawa opodatkowania narastająco (inna metoda niż "Szac. podatek" na Start/Firma, który liczy się od przychodu przed odjęciem ZUS — te dwie liczby będą się nieznacznie różnić).</div>${table}`,'analysis')
}

/* "Firma vs rynek" na Rynku i benchmarkach świadomie używa TYCH SAMYCH dwóch porównań co karta
   "Kontekst rynkowy" na Firmie (Koszty materiałów, Dynamika sprzedaży — identyczne liczby i
   formuły), żeby nie pokazywać tego samego pod dwiema różnymi wartościami w dwóch zakładkach.
   Firma pokazuje skrót (2 wiersze) z linkiem "Pokaż dane rynkowe →" tutaj; tutaj — pełna wersja +
   jeden dodatkowy wskaźnik, którego w skrócie nie ma: Marża, licząca się na żywo z prawdziwych
   danych księgowych (sales/costs/tax za cały dostępny okres), nie zaszyta na sztywno jak reszta. */
function marketScreen(){
  const idxs=months.map((_,i)=>i);
  const revV=sumIdx(sales,idxs)*1000,costV=sumIdx(costs,idxs)*1000,taxV=sumIdx(tax,idxs)*1000;
  const marginPct=revV?(revV-costV-taxV)/revV*100:0;
  const salesGrowthPct=(sales[sales.length-1]-sales[0])/sales[0]*100;
  /* Pasek "Firma vs rynek" — poprzednia wersja liczyła szerokość z |mine|/max(|mine|) w obrębie 3
     wierszy, czyli pokazywała tylko to, która z TWOICH TRZECH liczb jest największa (a to nie ma
     sensu, bo miesza wskaźnik poziomu — marża — z dynamikami r/r w %, różne jednostki miary) i w
     ogóle nie uwzględniała wartości rynkowej mimo nagłówka "vs rynek". Poprawka (2026-09-25, na
     wyraźną prośbę Aleksa): pasek koduje teraz deltę (Twoja firma − rynek) w punktach procentowych
     — to jest spójna jednostka między wierszami, więc porównywanie długości paska MA sens: dłuższy
     pasek = większe odchylenie od benchmarku. Kolor zależy od kierunku "dobrze/źle" dla danego
     wskaźnika (higherIsBetter) — dla kosztów materiałów wyższa wartość niż rynek jest zła, dla
     dynamiki sprzedaży i marży — dobra. */
  const rows=[
    {label:'Koszty materiałów',mine:materialsCostGrowthPct(),mineDisplay:fmtPct(materialsCostGrowthPct()),marketVal:7.2,marketDisplay:'GUS/PPI (szac.) +7,2%',higherIsBetter:false},
    {label:'Dynamika sprzedaży',mine:salesGrowthPct,mineDisplay:fmtPct(salesGrowthPct),marketVal:4.8,marketDisplay:'branża meblarska (GUS, szac.) +4,8%',higherIsBetter:true},
    {label:'Marża',mine:marginPct,mineDisplay:(marginPct>=0?'+':'')+marginPct.toFixed(1).replace('.',',')+'%',marketVal:21,marketDisplay:'branża meblarska (GUS, szac.) ~21%',higherIsBetter:true}
  ].map(r=>{const delta=r.mine-r.marketVal;const favorable=r.higherIsBetter?delta>=0:delta<=0;return{...r,delta,favorable}});
  const maxAbsDelta=Math.max(...rows.map(r=>Math.abs(r.delta)),1);
  const compareRows=rows.map(r=>{
    const deltaLabel=`${r.delta>=0?'+':''}${r.delta.toFixed(1).replace('.',',')} pp ${r.delta>=0?'powyżej':'poniżej'} rynku`;
    const color=r.favorable?'var(--success)':'var(--danger)';
    return `<div class="market-row"><span><b>${r.label}</b></span><span class="mine">Twoja firma ${r.mineDisplay}<br><span class="tiny-note" style="font-weight:700;color:${color}">${deltaLabel}</span></span><span class="market">${r.marketDisplay}</span></div><div class="compare-bar"><i style="width:${Math.max(4,Math.round(Math.abs(r.delta)/maxAbsDelta*90))}%;background:${color}"></i></div>`;
  }).join('');
  return shell(`<div class="page-header" style="display:grid;grid-template-columns:200px 1fr 200px;align-items:flex-start;gap:20px"><div><span class="pill green">Dane publiczne aktualne</span></div><div style="text-align:center"><h1>Rynek i benchmarki</h1><p>GUS i NBP jako kontekst decyzji — nie osobny dashboard makro.</p></div><div></div></div>${analysisNav('market')}<div class="grid grid-4"><div class="card"><div class="tiny-note">GUS / PPI — materiały (szac.)</div><div class="value" style="font-size:28px;font-weight:800;margin:6px 0">+7,2%</div><p class="card-sub">Zmiana r/r w dopasowanej kategorii.</p></div><div class="card"><div class="tiny-note">Branża meblarska — dynamika sprzedaży (GUS, szac.)</div><div class="value" style="font-size:28px;font-weight:800;margin:6px 0">+4,8%</div><p class="card-sub">Szacowana dynamika sprzedaży w branży.</p></div><div class="card"><div class="tiny-note">Branża meblarska — marża (GUS, szac.)</div><div class="value" style="font-size:28px;font-weight:800;margin:6px 0">~21%</div><p class="card-sub">Szacowana przeciętna marża w branży.</p></div><div class="card"><div class="tiny-note">NBP — EUR/PLN</div><div class="value" style="font-size:28px;font-weight:800;margin:6px 0">4,27</div><p class="card-sub">Ekspozycja Twojej firmy: niska.</p></div></div><div class="card" style="margin-top:16px"><div style="display:flex;align-items:baseline;justify-content:space-between;gap:10px"><h3 style="margin:0">Firma vs rynek</h3><span class="tiny-note">Dane za dostępny okres (Sty–Cze 2026)</span></div><div style="margin-top:10px">${compareRows}</div></div><div class="system-note" style="margin-top:16px"><b>Źródła demonstracyjne:</b> GUS/BDL, REGON i NBP. W produkcie każda seria powinna mieć identyfikator źródła, datę pobrania, częstotliwość aktualizacji i mapowanie do ekspozycji firmy.</div>`,'analysis')
}
function scenariosScreen(){const price=Number(state.scenarioPrice||0),volume=Number(state.scenarioVolume||85),hire=Number(state.scenarioHireCost||0);const volumeLabel=v=>v===100?'bez spadku':v>=90?'łagodne':v>=80?'umiarkowane':'ostrożne';const clientsByShare=[...clients].sort((a,b)=>b.share-a.share);const selectedClient=clientsByShare.find(c=>c.id===state.scenarioClientId)||clientsByShare[0];const clientLossPct=Number(state.scenarioClientLossPct||100);const concentrationLabel=s=>s>=15?'wysoka':s>=8?'umiarkowana':'niska';const baseRevenue=sales[sales.length-1]*1000,baseCost=costs[costs.length-1]*1000;const baseMargin=baseRevenue?(baseRevenue-baseCost)/baseRevenue*100:0;let title,headline,desc,boxes;if(state.scenarioType==='price'){
    /* Scenariusz "Cena" — przebudowany 2026-09-25 na wyraźną prośbę Aleksa. Baza to REALNY ostatni
       dostępny miesiąc (Czerwiec: sales/costs), nie zmyślona stała. Dwie zmienne: podwyżka ceny
       (slider) i utrzymany wolumen (dropdown 82/90/100%, teraz faktycznie podpięty pod stan).
       Założenie (Opcja A z rozmowy z Aleksem): koszty są w całości zmienne i skalują się wprost z
       wolumenem — mniej sztuk sprzedanych = proporcjonalnie mniej kosztu; sama podwyżka ceny nie
       zmienia kosztu wytworzenia. To jest ZAŁOŻENIE upraszczające (nie każdy koszt firmy faktycznie
       tak się zachowuje — czynsz czy część pensji bywa stała), świadomie przyjęte na start; jawnie
       nazwane w opisie scenariusza, żeby nie wyglądało na twardy fakt. */
    const newRevenue=baseRevenue*(1+price/100)*(volume/100);
    const newCost=baseCost*(volume/100);
    const newMargin=newRevenue?(newRevenue-newCost)/newRevenue*100:0;
    const revChange=Math.round(newRevenue-baseRevenue);
    const marginChangePP=newMargin-baseMargin;
    headline=`${revChange>=0?'+':''}${revChange.toLocaleString('pl-PL')} zł / mies.`;
    title=`Podwyżka cen o ${price}% przy ${volume}% wolumenu`;
    desc=`Baza: rzeczywista sprzedaż i koszt z ostatniego miesiąca (Czerwiec). Założenie: koszty w całości zmienne, skalują się z wolumenem — sama podwyżka ceny nie zmienia kosztu wytworzenia. To symulacja, nie prognoza.`;
    boxes=[['Wpływ na przychód',`${revChange>=0?'+':''}${revChange.toLocaleString('pl-PL')} zł`],['Marża w scenariuszu',`${newMargin>=0?'+':''}${newMargin.toFixed(1).replace('.',',')}% (${marginChangePP>=0?'+':''}${marginChangePP.toFixed(1).replace('.',',')} pp vs dziś)`],['Wolumen w scenariuszu',`${volume}% (dziś: 100%)`]]
  }else if(state.scenarioType==='hire'){
    /* Scenariusz "Zatrudnienie" — przebudowany 2026-09-25. Poprzednia wersja miała podwójny błąd:
       "potrzebna dodatkowa marża brutto" liczyła się jako hire/0,21 (to w ogóle nie jest marża
       brutto, tylko już próg sprzedaży — dzielenie przez marżę robi z kosztu przychód), a "próg
       dodatkowej sprzedaży" dzielił TEN wynik jeszcze raz przez 0,209 — czyli nakładał konwersję
       koszt→przychód DWA razy, na dodatek dwiema różnymi, zmyślonymi marżami (21% vs 20,9%).
       Teraz: jedna, realna marża brutto z ostatniego miesiąca (baseMargin, ta sama co w Cenie i
       Kliencie), konwersja koszt→przychód robi się raz. */
    const marginRate=baseMargin/100;
    const salesThreshold=marginRate>0?Math.round(hire/marginRate):0;
    headline=`${salesThreshold.toLocaleString('pl-PL')} zł / mies.`;
    title='Zatrudnienie kolejnej osoby';
    desc=`Przy dzisiejszej marży brutto (${baseMargin.toFixed(1).replace('.',',')}%, liczonej z ostatniego miesiąca) tyle dodatkowej sprzedaży miesięcznie potrzeba, żeby dodatkowa marża brutto pokryła koszt zatrudnienia. Brakuje danych o wykorzystaniu zespołu — to próg finansowy, nie rekomendacja „zatrudnij”.`;
    boxes=[['Koszt miesięczny',`${hire.toLocaleString('pl-PL')} zł`],['Próg dodatkowej sprzedaży',`${salesThreshold.toLocaleString('pl-PL')} zł`],['Pewność','niska — brak godzin']]
  }else{
    /* Scenariusz "Klient" — przebudowany 2026-09-25 na wyraźną prośbę Aleksa. Zamiast suwaka z
       wymyślonym % i dekoracyjnego dropdownu ABC/XYZ — realna lista 12 klientów z ich prawdziwym
       udziałem i wartością sprzedaży z ostatniego miesiąca (tablica clients[], suma udziałów =
       100%, suma wartości = realny przychód czerwca). To samo założenie kosztowe co w scenariuszu
       Cena (Opcja A, ustalona z Aleksem): koszty związane z tym klientem są w całości zmienne i
       znikają proporcjonalnie do jego udziału — więc scenariusz pokazuje nie tylko spadek
       przychodu, ale i realny wpływ na marżę. */
    const revenueLost=Math.round(selectedClient.value);
    const costLost=Math.round(baseCost*selectedClient.share/100);
    /* "Marża po stracie" (pierwsza wersja) zawsze wychodziła ~0,0 pp zmiany dla KAŻDEGO klienta —
       to matematyczna konsekwencja założenia "koszt klienta skaluje się dokładnie z jego udziałem
       w przychodzie": ścinając przychód i koszt o ten sam %, marża % z definicji się nie zmienia.
       Złapane i zgłoszone Aleksowi (2026-09-25), zamienione na "Utracony zysk brutto" — konkretną
       kwotę w zł (przychód klienta minus jego zmienny koszt), która faktycznie różni się między
       klientami i realnie pokazuje skalę straty. */
    /* Częściowa utrata klienta (2026-09-25, na wyraźną prośbę Aleksa) — druga zmienna obok wyboru
       klienta: jaki % TEGO klienta tracimy (35/50/75/100%), np. traci się część zamówień, nie
       całego kontrahenta. revenueLost i costLost skalują się dodatkowo o ten %, na tej samej
       zasadzie "koszty w całości zmienne" co reszta klienta i co scenariusz Cena. */
    const revenueLostPartial=Math.round(revenueLost*clientLossPct/100);
    const costLostPartial=Math.round(costLost*clientLossPct/100);
    const grossProfitLost=Math.round(revenueLostPartial-costLostPartial);
    headline=`-${revenueLostPartial.toLocaleString('pl-PL')} zł / mies.`;

    desc=`Bazuje na rzeczywistym udziale tego klienta w sprzedaży z ostatniego miesiąca (${selectedClient.share.toFixed(1).replace('.',',')}%, ${revenueLost.toLocaleString('pl-PL')} zł), z czego zakładamy utratę ${clientLossPct}%. Założenie: koszty związane z tym klientem są w całości zmienne i znikają proporcjonalnie do jego udziału — to samo założenie co w scenariuszu Cena. To symulacja, nie prognoza.`;
    boxes=[['Spadek przychodu',`-${revenueLostPartial.toLocaleString('pl-PL')} zł`],['Utracony zysk brutto',`-${grossProfitLost.toLocaleString('pl-PL')} zł`],['Koncentracja ryzyka',`${concentrationLabel(selectedClient.share)} (${selectedClient.share.toFixed(1).replace('.',',')}% sprzedaży)`]]
  };return shell(`<div class="page-header" style="display:grid;grid-template-columns:200px 1fr 200px;align-items:flex-start;gap:20px"><div></div><div style="text-align:center"><h1>Co jeśli?</h1><p>Scenariusze wspierają decyzję. Nie są automatyczną prognozą.</p></div><div></div></div>${analysisNav('scenarios')}<div class="scenario-shell"><div class="card scenario-controls"><div class="segmented"><button class="${state.scenarioType==='price'?'active':''}" onclick="state.scenarioType='price';render()">Cena</button><button class="${state.scenarioType==='client'?'active':''}" onclick="state.scenarioType='client';render()">Klient</button><button class="${state.scenarioType==='hire'?'active':''}" onclick="state.scenarioType='hire';render()">Zatrudnienie</button></div>${state.scenarioType==='price'?`<div class="range-wrap"><label><span>Podwyżka cen</span><b>${price}%</b></label><input type="range" min="0" max="15" value="${price}" oninput="state.scenarioPrice=this.value;render()"></div><div class="form-group"><label>Założenie utrzymania wolumenu</label><select onchange="state.scenarioVolume=Number(this.value);render()">${[70,75,80,85,90,95,100].map(v=>`<option value="${v}" ${volume===v?'selected':''}>${v}% — ${volumeLabel(v)}</option>`).join('')}</select></div>`:state.scenarioType==='hire'?`<div class="range-wrap"><label><span>Miesięczny koszt pracownika</span><b>${hire.toLocaleString('pl-PL')} zł</b></label><input type="range" min="4000" max="20000" step="500" value="${hire}" oninput="state.scenarioHireCost=this.value;render()"></div><div class="demo-note">Brakuje danych o wykorzystaniu zespołu. Wynik ma charakter progu finansowego, nie rekomendacji „zatrudnij”.</div>`:`<div class="form-group"><label>Klient</label><select onchange="state.scenarioClientId=this.value;render()">${clientsByShare.map(c=>`<option value="${c.id}" ${selectedClient.id===c.id?'selected':''}>${c.name} — ${c.share.toFixed(1).replace('.',',')}%</option>`).join('')}</select></div><div class="form-group"><label>Jaką część tego klienta tracimy?</label><select onchange="state.scenarioClientLossPct=Number(this.value);render()">${[25,50,75,100].map(p=>`<option value="${p}" ${clientLossPct===p?'selected':''}>${p}%${p===100?' — cały klient':''}</option>`).join('')}</select></div><div class="demo-note">Udział i wartość sprzedaży to realne dane tego klienta z ostatniego miesiąca.</div>`}<button class="btn btn-secondary" style="width:100%;margin-top:10px" onclick="openAssistant('Scenariusz: ${title}')">Porozmawiaj o scenariuszu</button></div><div class="scenario-result"><div class="tiny-note" style="color:#BDD0E2">SCENARIUSZ</div><h2 style="font-size:25px;margin:5px 0">${title}</h2><div class="big">${headline}</div><p>${desc}</p><div class="result-grid">${boxes.map(x=>`<div class="result-box"><small>${x[0]}</small><b>${x[1]}</b></div>`).join('')}</div></div></div><div class="card" style="margin-top:16px"><h3 style="margin-top:0">Co musiałoby być prawdą, żeby decyzja miała sens?</h3><div class="list-check"><div class="check-row"><span class="check">✓</span>Założenia scenariusza są jawne i można je zmienić.</div><div class="check-row"><span class="check">✓</span>Klarvido pokazuje, których danych brakuje.</div><div class="check-row"><span class="check">✓</span>Wynik nie jest przedstawiany jako pewna prognoza.</div></div></div>`,'analysis')}

function plForm(n,one,few,many){if(n===1)return one;const m10=n%10,m100=n%100;if(m10>=2&&m10<=4&&!(m100>=12&&m100<=14))return few;return many}
/* Wykres 6-miesięcznej sprzedaży klienta — z tego samego client.trend, z którego wygenerowano
   faktury (generateSalesInvoices), czyli realne dane, nie ozdobna krzywa. */
function clientTrendChart(c){
  const vals=c.trend.map(v=>v*1000);
  const w=600,h=200,padL=48,padR=10,padT=16,padB=28;
  const maxVal=Math.max(...vals,1);
  const niceMax=Math.ceil(maxVal/10000)*10000||10000;
  const n=vals.length;
  const stepX=(w-padL-padR)/(n-1);
  const xFor=i=>padL+i*stepX;
  const yFor=v=>padT+(1-v/niceMax)*(h-padT-padB);
  const base=h-padB;
  const pts=vals.map((v,i)=>({x:xFor(i),y:yFor(v)}));
  const gridCount=4;let grid='';
  for(let g=0;g<=gridCount;g++){const val=niceMax*g/gridCount;const y=yFor(val);grid+=`<line x1="${padL}" y1="${y.toFixed(1)}" x2="${w-padR}" y2="${y.toFixed(1)}" stroke="#E8EDF3" stroke-width="1"/><text x="${(padL-8).toFixed(1)}" y="${(y+3).toFixed(1)}" font-size="9" fill="#8398AE" text-anchor="end">${Math.round(val/1000)} tys.</text>`}
  const axisX=`<line x1="${padL}" y1="${base.toFixed(1)}" x2="${w-padR}" y2="${base.toFixed(1)}" stroke="#CBD5E1" stroke-width="1"/>`;
  const xLabels=vals.map((v,i)=>`<text x="${xFor(i).toFixed(1)}" y="${h-8}" font-size="10" fill="#8398AE" text-anchor="middle">${months[i]}</text>`).join('');
  const line=catmullRomPath(pts);
  const area=`${line} L${pts[n-1].x.toFixed(1)},${base.toFixed(1)} L${pts[0].x.toFixed(1)},${base.toFixed(1)} Z`;
  return `<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:200px"><defs><linearGradient id="clientTrendGrad" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--primary)" stop-opacity=".18"/><stop offset="1" stop-color="var(--primary)" stop-opacity="0"/></linearGradient></defs>${grid}${axisX}<path d="${area}" fill="url(#clientTrendGrad)"/><path d="${line}" fill="none" stroke="var(--primary)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>${xLabels}</svg>`
}
function clientDetailScreen(){

/* Statystyki klientów dla wybranego zakresu — liczone z client.trend, czyli z tych samych
   miesięcznych sum faktur sprzedażowych, z których w tym mockupie wygenerowane zostały
   faktury (generateSalesInvoices). Zmiana = wybrany okres vs poprzedni okres tej samej długości. */
function clientRangeStats(range,customMonth){
  customMonth=customMonth===undefined?state.clientsCustomMonth:customMonth;
  const{current,previous}=rangeMonthIdx(range,customMonth);
  const currentMonthNums=current.map(i=>i+1);
  const sumTrend=(c,idxs)=>idxs.reduce((s,i)=>s+(c.trend[i]||0),0)*1000;
  const rows=clients.map(c=>{
    const curVal=sumTrend(c,current);
    const prevVal=previous?sumTrend(c,previous):null;
    const change=(prevVal!==null&&prevVal>0)?(curVal-prevVal)/prevVal*100:null;
    /* Faktury — realna liczba faktur sprzedażowych tego klienta w wybranym zakresie,
       policzona z tablicy invoices (te same dane źródłowe co zakładka Faktury), a nie
       ze statycznego pola c.invoices, które jest tylko orientacyjnym szacunkiem. */
    const invoiceCount=invoices.filter(inv=>inv.type==='Sprzedaż'&&inv.party===c.name&&currentMonthNums.includes(invoiceMonthNum(inv.date))).length;
    return{...c,curVal,prevVal,change,invoiceCount};
  });
  const totalCur=rows.reduce((s,r)=>s+r.curVal,0);
  const totalPrev=previous?rows.reduce((s,r)=>s+(r.prevVal||0),0):0;
  rows.forEach(r=>{r.shareCur=totalCur?r.curVal/totalCur*100:0;r.sharePrev=(previous&&totalPrev)?(r.prevVal||0)/totalPrev*100:null});
  return{rows,totalCur}
}

    else{va=a[key]===null?-Infinity:a[key];vb=b[key]===null?-Infinity:b[key]}

  });

}

function filteredSortedInvoices(){

    return true
  });
  const {key,dir}=state.invoiceSort;
