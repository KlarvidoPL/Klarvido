name: "Infra"

on:
  push:
    branches: [ '**' ]
    paths:
      - 'packages/infra/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/infra.yml'
      - '.github/workflows/actions/setup/**'

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        infra-lib-name:
          - infra-core
          - infra-shared
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
      - uses: ./.github/workflows/actions/setup
        with:
          node-version: 22

      - shell: bash
        run: pnpm install
            --include-workspace-root
            --frozen-lockfile
            --filter=${{ matrix.infra-lib-name }}...

      - name: "${{ matrix.infra-lib-name }}: Lint"
        shell: bash
        run: pnpm nx run ${{ matrix.infra-lib-name }}:lint

      - name: "${{ matrix.infra-lib-name }}: Build"
        shell: bash
        run: pnpm nx run ${{ matrix.infra-lib-name }}:build
