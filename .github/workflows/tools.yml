name: "internal/tools"

on:
  push:
    branches: [ '**' ]
    paths:
      - 'packages/internal/tools/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/tools.yml'
      - '.github/workflows/actions/setup/**'

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
      - uses: ./.github/workflows/actions/setup
        with:
          node-version: 22

      - shell: bash
        run: pnpm install
          --include-workspace-root
          --frozen-lockfile
          --filter=tools...

      - name: Lint
        shell: bash
        run: pnpm nx run tools:lint
