name: "Workers"


on:
  push:
    branches: [ '**' ]
    paths:
      - 'packages/workers/**'
      - 'packages/webapp-libs/webapp-emails/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/workers.yml'
      - '.github/workflows/actions/setup/**'

jobs:
  build:
    runs-on: [self-hosted, klarvido]
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
      - uses: ./.github/workflows/actions/setup
        with:
          node-version: 22

      - shell: bash
        run: pnpm install
          --include-workspace-root
          --frozen-lockfile
          --filter=workers...
          --filter=webapp-emails...

      - name: Build emails renderer
        shell: bash
        run: pnpm nx run webapp-emails:build

      - name: Build
        shell: bash
        run: pnpm nx run workers:build

  test:
    runs-on: [self-hosted, klarvido]
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
      - uses: ./.github/workflows/actions/setup
        with:
          node-version: 22

      - shell: bash
        run: pnpm install
            --include-workspace-root
            --frozen-lockfile
            --filter=workers...

      - name: Lint workers
        shell: bash
        run: pnpm nx run workers:lint

      - name: Test workers
        shell: bash
        run: pnpm nx run workers:test

      - name: SonarCloud Scan
        uses: sonarsource/sonarcloud-github-action@master
        if: env.SONAR_ORGANIZATION != ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION }}
          SONAR_WORKERS_PROJECT_KEY: ${{ vars.SONAR_WORKERS_PROJECT_KEY }}
        with:
          projectBaseDir: packages/workers
