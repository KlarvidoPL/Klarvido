name: "internal/status-dashboard"

on:
  push:
    branches: [ '**' ]
    paths:
      - 'packages/internal/status-dashboard/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/status-dashboard.yml'
      - '.github/workflows/actions/setup/**'

jobs:
  build:
    runs-on: [self-hosted, klarvido]
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
      - uses: ./.github/workflows/actions/setup
        with:
          node-version: 22

      - shell: bash
        run: pnpm install
          --include-workspace-root
          --frozen-lockfile
          --filter=status-dashboard...

      - name: Lint
        shell: bash
        run: pnpm nx run status-dashboard:lint

      - name: Build
        shell: bash
        run: pnpm nx run status-dashboard:build
